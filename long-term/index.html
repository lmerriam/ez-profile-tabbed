        const str = String(seed);
        let hash = 0;
        for (let i = 0; i < str.length; i += 1)
          hash = str.charCodeAt(i) + ((hash << 5) - hash);
        const hue = (Math.abs(hash) * 137.508) % 360;
        return `hsl(${hue}, 55%, 50%)`;

          <Typography sx={{ fontSize: 12.5, color: colors.labelText, flexShrink: 0 }}>{label}</Typography>
          <Typography sx={{ fontSize: 13, color: colors.primaryText, textAlign: "right", fontFamily: mono ? "monospace" : "inherit" }}>
            {value}
          </Typography>
        </Stack>
      );

      const YesNo = ({ value }) => (
        <Chip
          size="small"
          label={value ? "Yes" : "No"}
          sx={{
            height: 18,
            fontSize: 10,
            fontWeight: 600,
            backgroundColor: value ? "#C8E6C9" : "#EEEEEE",
            color: value ? "#2e7d32" : colors.labelText,
          }}
        />
      );

      // Note: cards whose functions moved to a dedicated tab (Notes, Documents,
      // Communication log, Tasks) are intentionally omitted. During staged
      // rollout the remaining live cards + action buttons are reused here.
      const OverviewPanel = ({ onAction, onGoTab }) => {
        const ins = CLIENT.insurance;
        return (
          <PanelWrap>
            {/* Reused top action buttons from the current live profile */}
            <Stack direction="row" spacing={1} sx={{ mb: 2, flexWrap: "wrap", gap: 1 }}>
              {[
                { label: "Edit Care Plan", icon: <EditNoteIcon /> },
                { label: "Create Clinician Escalation", icon: <WarningAmberIcon /> },
                { label: "Create Task", icon: <AddIcon /> },
                { label: "Send Authorization Consent", icon: <VerifiedUserOutlinedIcon /> },
                { label: "Re-send Welcome Gift", icon: <CardGiftcardIcon /> },
              ].map((b) => (
                <Button
                  key={b.label}
                  size="small"
                  variant="outlined"
                  startIcon={b.icon}
                  onClick={() => onAction(b.label)}
                  sx={{ fontSize: 12, borderColor: colors.border, color: colors.secondaryText, textTransform: "none" }}
                >
                  {b.label}
                </Button>
              ))}
            </Stack>

            {/* Masonry-style multi-column card flow */}
            <Box
              sx={{
                columnGap: 2,
                columnWidth: 340,
                "& > *": { breakInside: "avoid" },
              }}
            >
              {/* BASIC INFO — fields not already in the left sidebar */}
              <CollapsibleCard title="Basic info" icon={InfoOutlinedIcon}>
                <Stack spacing={1.25}>
                  <KV label="Client ID" value={CLIENT.clientId} mono />
                  <KV label="Preferred name" value={CLIENT.preferredName} />
                  <KV label="Date of birth" value={`${CLIENT.dob} (age ${CLIENT.age})`} />
                  <KV label="Sex" value={CLIENT.sex} />
                  <KV label="Language" value={CLIENT.language} />
                  <KV label="Date eligible" value={CLIENT.dateEligible} />
                  <KV label="Callback preference" value={CLIENT.callbackPreference} />
                  <Stack direction="row" justifyContent="space-between" alignItems="center">
                    <Typography sx={{ fontSize: 12.5, color: colors.labelText }}>Eligible for PIN</Typography>
                    <YesNo value={CLIENT.eligiblePIN} />
                  </Stack>
                  <Stack direction="row" justifyContent="space-between" alignItems="center">
                    <Typography sx={{ fontSize: 12.5, color: colors.labelText }}>Eligible for CCM</Typography>
                    <YesNo value={CLIENT.eligibleCCM} />
                  </Stack>
                  <KV label="Status" value={CLIENT.statusDetail} />
                  <KV label="Flag" value={CLIENT.flag} />
                  <Stack direction="row" justifyContent="space-between" alignItems="baseline">
                    <Typography sx={{ fontSize: 12.5, color: colors.labelText }}>Leads with same phone</Typography>
                    <Typography sx={{ fontSize: 13, color: colors.primary }}>{CLIENT.leadsSamePhone}</Typography>
                  </Stack>
                </Stack>
              </CollapsibleCard>

              {/* INSURANCE & CONSENTS */}
              <CollapsibleCard title="Insurance & consents" icon={VerifiedUserOutlinedIcon}>
                <Stack spacing={1.25}>
                  <KV label="Medicare number" value={ins.medicareNumber} mono />
                  <Stack direction="row" justifyContent="space-between" alignItems="center">
                    <Typography sx={{ fontSize: 12.5, color: colors.labelText }}>Insurance verified</Typography>
                    <YesNo value={ins.verified} />
                  </Stack>
                  <KV label="Supplemental" value={ins.supplemental} />
                  <KV label="Secondary updated" value={ins.secondaryUpdated} />
                  <Divider sx={{ borderColor: colors.lightBorder }} />
                  <Stack direction="row" justifyContent="space-between" alignItems="center">
                    <Typography sx={{ fontSize: 12.5, color: colors.labelText }}>Signed consents</Typography>
                    <YesNo value={ins.signedConsents} />
                  </Stack>
                  <KV label="Standard Medicare consent" value={ins.standardConsentSent} />
                  <KV label="Authorization consent" value={ins.authConsentSent} />
                  <Box sx={{ backgroundColor: "#FFF8E1", borderRadius: "3px", p: 1, mt: 0.5 }}>
                    <Typography sx={{ fontSize: 12, color: "#8a6d00", lineHeight: 1.4 }}>
                      <Box component="span" sx={{ fontWeight: 600 }}>Out-of-pocket cost — </Box>
                      {ins.oopNote}
                    </Typography>
                  </Box>
                </Stack>
              </CollapsibleCard>

              {/* CONCRETE WINS */}
              <CollapsibleCard title="Concrete wins" icon={EmojiEventsOutlinedIcon}>
                <Stack spacing={1.5}>
                  {CLIENT.concreteWins.map((w, i) => (
                    <Box key={i}>
                      <Typography sx={{ fontSize: 11.5, color: colors.timestampText, mb: 0.25 }}>{w.when}</Typography>
                      <Typography sx={{ fontSize: 13, color: colors.primaryText, lineHeight: 1.55 }}>{w.text}</Typography>
                    </Box>
                  ))}
                  <Button size="small" startIcon={<AddIcon />} onClick={() => onAction("Record win")} sx={{ fontSize: 11, color: colors.primary, alignSelf: "flex-start" }}>
                    Record win
                  </Button>
                </Stack>
              </CollapsibleCard>

              {/* CARE PLAN */}
              <CollapsibleCard title="Care plan" icon={ArticleOutlinedIcon}>
                <Typography sx={{ fontSize: 13, color: colors.primaryText, lineHeight: 1.6, whiteSpace: "pre-wrap" }}>
                  {CLIENT.carePlan}
                </Typography>
                <Button size="small" startIcon={<EditNoteIcon />} onClick={() => onAction("Edit Care Plan")} sx={{ fontSize: 11, color: colors.primary, mt: 1 }}>
                  Edit care plan
                </Button>
              </CollapsibleCard>

              {/* DIAGNOSES & SDOH CODES */}
              <CollapsibleCard title="Diagnoses & SDOH codes" icon={TagOutlinedIcon}>
                <Stack spacing={1.5}>
                  {CLIENT.sdoh.map((s) => (
                    <Box key={s.code}>
                      <SectionLabel>{s.category}</SectionLabel>
                      <Stack direction="row" spacing={1} sx={{ mt: 0.25 }}>
                        <Typography sx={{ fontSize: 13, fontWeight: 600, color: colors.primary, fontFamily: "monospace", flexShrink: 0 }}>
                          {s.code}
                        </Typography>
                        <Typography sx={{ fontSize: 13, color: colors.primaryText }}>{s.label}</Typography>
                      </Stack>
                    </Box>
                  ))}
                </Stack>
              </CollapsibleCard>

              {/* ELIGIBILITY NOTE SUMMARY */}
              <CollapsibleCard title="Eligibility note summary" icon={AssignmentTurnedInOutlinedIcon} defaultExpanded={false}>
                <Stack spacing={1.25}>
                  <KV label="Date of visit" value={CLIENT.eligibilitySummary.visitDate} />
                  <KV label="Age" value={CLIENT.eligibilitySummary.age} />
                  <KV label="Clinician" value={CLIENT.eligibilitySummary.clinician} />
                  <KV label="Supervising physician" value={CLIENT.eligibilitySummary.supervisingPhysician} />
                  <KV label="Concierge" value={CLIENT.eligibilitySummary.concierge} />
                  <Divider sx={{ borderColor: colors.lightBorder }} />
                  {CLIENT.eligibilitySummary.sections.map((s) => (
                    <Stack key={s} direction="row" spacing={0.5} alignItems="center">
                      <ExpandMoreIcon sx={{ fontSize: 16, color: colors.mutedText, transform: "rotate(-90deg)" }} />
                      <Typography sx={{ fontSize: 13, color: colors.secondaryText }}>{s}</Typography>
                    </Stack>
                  ))}
                </Stack>
              </CollapsibleCard>

              {/* TIME TRACKING */}
              <CollapsibleCard title="Time tracking" icon={TimerOutlinedIcon} defaultExpanded={false}>
                <Stack spacing={1}>
                  <KV label="Logged this month" value={CLIENT.timeTracking.loggedThisMonth} />
                  <KV label="Researcher hrs this month" value={CLIENT.timeTracking.researcherThisMonth} />
                  <KV label="Available this month" value={CLIENT.timeTracking.availableThisMonth} />
                  <KV label="Logged all time" value={CLIENT.timeTracking.loggedAllTime} />
                  <Button size="small" startIcon={<AddIcon />} onClick={() => onAction("Log time block")} sx={{ fontSize: 11, color: colors.primary, alignSelf: "flex-start" }}>
                    Log time block
                  </Button>
                </Stack>
              </CollapsibleCard>

              {/* CLIENT COMMUNICATIONS (settings only — log lives in Communication tab) */}
              <CollapsibleCard title="Communication settings" icon={SettingsOutlinedIcon} defaultExpanded={false}>
                <Stack spacing={1.25}>
                  <KV label="Client-facing number" value={CLIENT.comms.clientFacingNumber} />
                  <KV label="Forwarding email" value={CLIENT.comms.forwardingEmail} />
                  <Stack direction="row" justifyContent="space-between" alignItems="center">
                    <Typography sx={{ fontSize: 12.5, color: colors.labelText }}>Forward mail to client</Typography>
                    <YesNo value={CLIENT.comms.forwardToClient} />
                  </Stack>
                  <ButtonBase
                    onClick={() => onGoTab("comms")}
                    sx={{ alignSelf: "flex-start", fontSize: 12, fontWeight: 500, color: colors.primary, mt: 0.5 }}
                  >
                    View communication thread →
                  </ButtonBase>
                </Stack>
              </CollapsibleCard>

              {/* WELCOME CALL / GIFT */}
              <CollapsibleCard title="Welcome" icon={CardGiftcardIcon} defaultExpanded={false}>
                <Stack spacing={1}>
                  <KV label="Welcome gift sent" value={`${CLIENT.welcomeGift.sentTimes}× · last ${CLIENT.welcomeGift.lastSent}`} />
                  <Stack direction="row" spacing={2}>
                    <ButtonBase onClick={() => onAction("Welcome call plan")} sx={{ fontSize: 12, fontWeight: 500, color: colors.primary }}>
                      Welcome call plan →
                    </ButtonBase>
                    <ButtonBase onClick={() => onAction("Welcome call notes")} sx={{ fontSize: 12, fontWeight: 500, color: colors.primary }}>
                      Welcome call notes →
                    </ButtonBase>
                  </Stack>
                </Stack>
              </CollapsibleCard>

              {/* ADDITIONAL PHONE NUMBERS */}
              <CollapsibleCard title="Additional phone numbers" icon={PhoneIcon} defaultExpanded={false}>
                {CLIENT.additionalPhones.length ? (
                  <Stack spacing={1}>
                    {CLIENT.additionalPhones.map((p) => (
                      <KV key={p} label="Phone" value={p} />
                    ))}
                  </Stack>
                ) : (
                  <Typography sx={{ fontSize: 13, color: colors.mutedText, fontStyle: "italic" }}>
                    No additional numbers.
                  </Typography>
                )}
                <Button size="small" startIcon={<AddIcon />} onClick={() => onAction("Add number")} sx={{ fontSize: 11, color: colors.primary, mt: 1 }}>
                  Add number
                </Button>
              </CollapsibleCard>

              {/* GUIDE HISTORY */}
              <CollapsibleCard title="Guide history" icon={HistoryToggleOffIcon} defaultExpanded={false}>
                <Stack spacing={1}>
                  {CLIENT.guideHistory.map((g) => (
                    <Stack key={g.name} direction="row" spacing={1} alignItems="center">
                      <UserAvatar name={g.name} colorSeed={g.name} sx={{ width: 22, height: 22, fontSize: 9 }} />
                      <Box>
                        <Typography sx={{ fontSize: 13, fontWeight: 500, color: colors.primaryText }}>{g.name}</Typography>
                        <Typography sx={{ fontSize: 11.5, color: colors.labelText }}>{g.range}</Typography>
                      </Box>
                    </Stack>
                  ))}
                </Stack>
              </CollapsibleCard>
            </Box>
          </PanelWrap>
        );
      };

      // --- Activity type config: icon, tint, verb, and source label ---------
      const ACTIVITY_META = {
        research_update: { verb: "updated research note", tint: "#9164ff", bg: "#f3eeff", Icon: EditNoteIcon, cta: "Open note" },
        note: { verb: "added a note", tint: colors.primary, bg: "#F3FAFF", Icon: NotesIcon, cta: "Open note" },
        call: { verb: "logged a call", tint: colors.green, bg: "#eef7ef", Icon: PhoneInTalkIcon, cta: "Open call" },
        task_created: { verb: "created a task", tint: "#00897b", bg: "#e6f4f2", Icon: PlaylistAddCheckIcon, cta: "Open task" },
        task_status: { verb: "updated a task", tint: "#00897b", bg: "#e6f4f2", Icon: TaskAltIcon, cta: "Open task" },
        document: { verb: "uploaded a document", tint: "#ef6c00", bg: "#fff3e0", Icon: DescriptionOutlinedIcon, cta: "Open document" },
        system: { verb: "system update", tint: colors.mutedText, bg: colors.emptyCardBg, Icon: SettingsSuggestIcon, cta: null },
      };

      // Highlights just the newly-added text from a note update (no removed
      // content) — a lightweight "what's new" view rather than a full diff.
      const AddedBlock = ({ added = [] }) => (
        <Box
          sx={{
            mt: 1,
            border: `1px solid ${colors.lightBorder}`,
            borderRadius: "3px",
            overflow: "hidden",
            fontSize: 12.5,
            lineHeight: 1.5,
          }}
        >
          {added.map((line, i) => (
            <Box
              key={"a" + i}
              sx={{
                px: 1.25,
                py: 0.5,
                backgroundColor: "#eaf7ec",
                color: "#256b2b",
                borderBottom: i < added.length - 1 ? `1px solid ${colors.lightBorder}` : "none",
              }}
            >
              {line}
            </Box>
          ))}
        </Box>
      );

      // A single feed entry. Collapsed: type marker, headline, and the
      // "what's new" gist (added text for updates, a short preview otherwise).
      // Expanded: reveals the author, full content, and the "go to source" link.
      const FeedItem = ({ item, isLast, onNavigate }) => {
        const [expanded, setExpanded] = useState(false);
        const meta = ACTIVITY_META[item.type];
        const { Icon } = meta;
        const bodyText = item.full || item.preview || null;

        return (
          <Stack direction="row" spacing={1.5} sx={{ position: "relative", pb: 2.5 }}>
            {/* timeline rail */}
            {!isLast && (
              <Box
                sx={{
                  position: "absolute",
                  left: 15,
                  top: 34,
                  bottom: 0,
                  width: "1px",
                  backgroundColor: colors.lightBorder,
                }}
              />
            )}
            {/* type marker */}
            <Box
              sx={{
                width: 32,
                height: 32,
                borderRadius: "50%",
                backgroundColor: meta.bg,
                display: "flex",
                alignItems: "center",
                justifyContent: "center",
                flexShrink: 0,
                zIndex: 1,
              }}
            >
              <Icon sx={{ fontSize: 18, color: meta.tint }} />
            </Box>

            {/* card — click to expand */}
            <Box
              onClick={() => setExpanded((e) => !e)}
              sx={{
                flex: 1,
                minWidth: 0,
                border: `1px solid ${expanded ? colors.cardHoverBorder : colors.lightBorder}`,
                borderRadius: "3px",
                p: 1.5,
                cursor: "pointer",
                "&:hover": { backgroundColor: expanded ? "transparent" : colors.cardHoverBg },
              }}
            >
              {/* header: verb + timestamp (author hidden until expanded) */}
              <Stack direction="row" alignItems="center" spacing={0.75} sx={{ mb: 0.25 }}>
                <Typography sx={{ fontSize: 12.5, color: colors.labelText }}>{meta.verb}</Typography>
                <Box sx={{ flex: 1 }} />
                <Typography sx={{ fontSize: 11, color: colors.timestampText, whiteSpace: "nowrap" }}>{item.when}</Typography>
              </Stack>

              {/* headline / source title */}
              <Typography sx={{ fontSize: 14, fontWeight: 600, color: colors.primaryText, mt: 0.25 }}>
                {item.title}
              </Typography>

              {/* note updates: show summary + the newly added text (green only) */}
              {item.type === "research_update" && (
                <>
                  {item.summary && (
                    <Typography sx={{ fontSize: 12.5, color: colors.labelText, fontStyle: "italic", mt: 0.25 }}>
                      {item.summary}
                    </Typography>
                  )}
                  <AddedBlock added={item.added} />
                </>
              )}

              {item.meta && (
                <Typography sx={{ fontSize: 12.5, color: colors.labelText, mt: 0.25 }}>{item.meta}</Typography>
              )}

              {/* body preview — clamped when collapsed, full when expanded */}
              {bodyText && (
                <Typography
                  sx={{
                    fontSize: 13,
                    color: colors.secondaryText,
                    mt: 0.75,
                    whiteSpace: "pre-wrap",
                    ...(expanded
                      ? {}
                      : {
                          display: "-webkit-box",
                          WebkitLineClamp: 2,
                          WebkitBoxOrient: "vertical",
                          overflow: "hidden",
                        }),
                  }}
                >
                  {bodyText}
                </Typography>
              )}

              {/* expanded-only: author + navigate-to-source */}
              <Collapse in={expanded} timeout="auto" unmountOnExit>
                <Box sx={{ mt: 1.25 }}>
                  <Stack direction="row" spacing={0.75} alignItems="center">
                    <UserAvatar name={item.who} colorSeed={item.who} sx={{ width: 18, height: 18, fontSize: 8 }} />
                    <Typography sx={{ fontSize: 11.5, color: colors.labelText }}>
                      {item.who} · {item.when}
                    </Typography>
                  </Stack>
                  {item.source && meta.cta && (
                    <ButtonBase
                      onClick={(e) => { e.stopPropagation(); onNavigate(item.source); }}
                      sx={{
                        mt: 1,
                        display: "inline-flex",
                        alignItems: "center",
                        gap: 0.5,
                        fontSize: 12,
                        fontWeight: 500,
                        color: colors.primary,
                      }}
                    >
                      {meta.cta}
                      <EastIcon sx={{ fontSize: 13 }} />
                    </ButtonBase>
                  )}
                </Box>
              </Collapse>
            </Box>
          </Stack>
        );
      };

      const FeedPanel = ({ onNavigate }) => (
        <PanelWrap>
          <Box sx={{ maxWidth: 720 }}>
            <Stack direction="row" justifyContent="space-between" alignItems="center" sx={{ mb: 2 }}>
              <SectionLabel>Feed</SectionLabel>
              <Typography sx={mutedTextSx}>{ACTIVITY.length} updates</Typography>
            </Stack>
            {ACTIVITY.map((item, i) => (
              <FeedItem
                key={item.id}
                item={item}
                isLast={i === ACTIVITY.length - 1}
                onNavigate={onNavigate}
              />
            ))}
          </Box>
        </PanelWrap>
      );

      // An inline, expandable + editable note card. Guides can expand a note
      // and edit it in place — e.g. update a research note while the call
      // panel is open on the right and they're taking call notes.
      const NoteCard = ({ note, call, expanded, onToggle, onSave, onOpenCall, autoFocus }) => {
        // Notion-style: expanding a note drops straight into an editable
        // document. Title + body live on one continuous surface and edits
        // save on change — no separate edit mode or Save/Cancel buttons.
        const [title, setTitle] = useState(note.title);
        const [body, setBody] = useState(note.body);
        const bodyRef = useRef(null);

        // Sync local draft when the underlying note changes externally
        // (e.g. navigated to, or updated elsewhere) while not focused here.
        useEffect(() => { setTitle(note.title); }, [note.title]);
        useEffect(() => { setBody(note.body); }, [note.body]);

        useEffect(() => {
          if (expanded && autoFocus && bodyRef.current) {
            const el = bodyRef.current.querySelector("textarea");
            if (el) el.focus();
          }
        }, [expanded, autoFocus]);

        const commitTitle = (v) => { setTitle(v); onSave(note.id, { title: v }); };
        const commitBody = (v) => { setBody(v); onSave(note.id, { body: v }); };

        return (
          <Box
            sx={{
              border: `1px solid ${expanded ? colors.cardHoverBorder : colors.lightBorder}`,
              borderRadius: "3px",
              overflow: "hidden",
              backgroundColor: "#fff",
            }}
          >
            {/* header row (click to expand). No caret — click anywhere.
                Call notes have no title, so they show the call date instead. */}
            <Box
              onClick={() => onToggle(note.id)}
              sx={{
                display: "flex",
                alignItems: "flex-start",
                gap: 1,
                p: 1.5,
                cursor: "pointer",
                "&:hover": { backgroundColor: expanded ? "transparent" : colors.cardHoverBg },
              }}
            >
              <Box sx={{ flex: 1, minWidth: 0 }}>
                <Stack direction="row" alignItems="center" spacing={0.75} sx={{ mb: 0.25, flexWrap: "wrap" }}>
                  {call ? (
                    <>
                      <CallDirection direction={call.direction} />
                      <Typography sx={{ fontSize: 14, fontWeight: 600, color: colors.primaryText }}>
                        Call · {call.when}
                      </Typography>
                      <PartyPill party={call.party} />
                    </>
                  ) : (
                    <Typography sx={{ fontSize: 14, fontWeight: 600, color: colors.primaryText }}>
                      {note.title || "Untitled note"}
                    </Typography>
                  )}
                </Stack>
                {/* Author is hidden until expanded (usually the dedicated guide). */}
                {!expanded && (
                  <Typography
                    sx={{
                      fontSize: 13,
                      color: colors.secondaryText,
                      mt: 0.25,
                      display: "-webkit-box",
                      WebkitLineClamp: 2,
                      WebkitBoxOrient: "vertical",
                      overflow: "hidden",
                      whiteSpace: "pre-wrap",
                    }}
                  >
                    {note.body}
                  </Typography>
                )}
                {!expanded && !call && (
                  <Typography sx={{ fontSize: 11.5, color: colors.timestampText, mt: 0.5 }}>
                    Updated {note.updatedWhen}
                  </Typography>
                )}
              </Box>
            </Box>

            {/* expanded: editable Notion-style document */}
            <Collapse in={expanded} timeout="auto" unmountOnExit>
              <Box sx={{ px: 1.5, pb: 1.5, pt: 0 }}>
                <Divider sx={{ borderColor: colors.lightBorder, mb: 0.5 }} />
                {/* Author shown on expand (usually the dedicated guide).
                    Call notes also show who the call was with. */}
                <Stack direction="row" spacing={0.75} alignItems="center" sx={{ my: 1, flexWrap: "wrap" }}>
                  <UserAvatar name={note.author} colorSeed={note.author} sx={{ width: 18, height: 18, fontSize: 8 }} />
                  <Typography sx={{ fontSize: 11.5, color: colors.labelText }}>
                    {call
                      ? `Logged by ${note.author} · ${call.when}`
                      : `${note.author} · updated ${note.updatedWhen}`}
                  </Typography>
                  {call && (
                    <>
                      <Typography sx={{ fontSize: 11.5, color: colors.mutedText }}>·</Typography>
                      <CallDirection direction={call.direction} />
                      <PartyPill party={call.party} />
                    </>
                  )}
                </Stack>
                {/* Single continuous document surface: title + body, borderless.
                    Call notes have no title (date-only). */}
                <Box>
                  {!call && (
                    <TextField
                      variant="standard"
                      placeholder="Untitled note"
                      value={title}
                      onChange={(e) => commitTitle(e.target.value)}
                      fullWidth
                      InputProps={{ disableUnderline: true }}
                      sx={{
                        "& .MuiInputBase-input": {
                          fontSize: 20,
                          fontWeight: 700,
                          color: colors.primaryText,
                          padding: "2px 0 2px",
                          lineHeight: 1.3,
                        },
                      }}
                    />
                  )}
                  <TextField
                    ref={bodyRef}
                    variant="standard"
                    placeholder="Start writing…"
                    value={body}
                    onChange={(e) => commitBody(e.target.value)}
                    fullWidth
                    multiline
                    minRows={4}
                    InputProps={{ disableUnderline: true }}
                    sx={{
                      "& .MuiInputBase-input": {
                        fontSize: 14,
                        color: colors.primaryText,
                        lineHeight: 1.6,
                        padding: 0,
                      },
                      "& .MuiInputBase-input::placeholder": { color: colors.mutedText, opacity: 1 },
                    }}
                  />
                </Box>

                {/* subtle footer: call link + created/edit metadata */}
                <Stack direction="row" spacing={1.5} alignItems="center" sx={{ mt: 1.5 }}>
                  {call && (
                    <ButtonBase
                      onClick={() => onOpenCall(call)}
                      sx={{ display: "inline-flex", alignItems: "center", gap: 0.5, fontSize: 12, fontWeight: 500, color: colors.primary }}
                    >
                      View call record <EastIcon sx={{ fontSize: 13 }} />
                    </ButtonBase>
                  )}
                  <Typography sx={{ fontSize: 11.5, color: colors.timestampText }}>
                    Created {note.createdWhen}
                    {note.versions && note.versions.length > 0
                      ? ` · ${note.versions.length} edit${note.versions.length === 1 ? "" : "s"}`
                      : ""}
                  </Typography>
                </Stack>
              </Box>
            </Collapse>
          </Box>
        );
      };

      const sortLabel = (n) => n.title || "Call note";
      const SORTS = {
        updated: { label: "Recently updated", fn: (a, b) => b.updatedTs - a.updatedTs },
        oldest: { label: "Oldest first", fn: (a, b) => a.updatedTs - b.updatedTs },
        title: { label: "Title (A–Z)", fn: (a, b) => sortLabel(a).localeCompare(sortLabel(b)) },
      };

      const NotesPanel = ({
        notes,
        callsById,
        expandedId,
        onToggleExpand,
        onSaveNote,
        onNewNote,
        onOpenCall,
        autoEditId,
      }) => {
        const [q, setQ] = useState("");
        const [sortKey, setSortKey] = useState("updated"); // default: recently updated
        const [filter, setFilter] = useState("all"); // all | call | standalone
        const [sortAnchor, setSortAnchor] = useState(null);

        const visible = useMemo(() => {
          let arr = notes.filter((n) => (n.title + n.body).toLowerCase().includes(q.toLowerCase()));
          if (filter === "call") arr = arr.filter((n) => n.callId);
          if (filter === "standalone") arr = arr.filter((n) => !n.callId);
          return [...arr].sort(SORTS[sortKey].fn);
        }, [notes, q, sortKey, filter]);

        const FilterChip = ({ value, label }) => (
          <Chip
            size="small"
            label={label}
            onClick={() => setFilter(value)}
            variant={filter === value ? "filled" : "outlined"}
            sx={{
              height: 26,
              fontSize: 12,
              borderRadius: "4px",
              cursor: "pointer",
              ...(filter === value
                ? { backgroundColor: colors.selectedBg, color: colors.primary, border: `1px solid ${colors.primary}` }
                : { color: colors.labelText, borderColor: colors.border }),
            }}
          />
        );

        return (
          <PanelWrap>
            <Box sx={{ maxWidth: 720 }}>
              {/* toolbar */}
              <Stack direction="row" spacing={1} alignItems="center" sx={{ mb: 1.5 }}>
                <TextField
                  size="small"
                  placeholder="Search notes"
                  value={q}
                  onChange={(e) => setQ(e.target.value)}
                  sx={{ flex: 1 }}
                  InputProps={{ startAdornment: (<InputAdornment position="start"><SearchIcon sx={{ color: colors.mutedText, fontSize: 18 }} /></InputAdornment>) }}
                />
                <Button
                  size="small"
                  variant="outlined"
                  endIcon={<UnfoldMoreIcon />}
                  onClick={(e) => setSortAnchor(e.currentTarget)}
                  sx={{ fontSize: 12, whiteSpace: "nowrap", color: colors.secondaryText, borderColor: colors.border }}
                >
                  {SORTS[sortKey].label}
                </Button>
                <Menu anchorEl={sortAnchor} open={!!sortAnchor} onClose={() => setSortAnchor(null)}>
                  {Object.entries(SORTS).map(([key, s]) => (
                    <MenuItem
                      key={key}
                      selected={key === sortKey}
                      onClick={() => { setSortKey(key); setSortAnchor(null); }}
                      sx={{ fontSize: 13 }}
                    >
                      {s.label}
                    </MenuItem>
                  ))}
                </Menu>
                <Button size="small" variant="contained" startIcon={<AddIcon />} onClick={onNewNote} sx={{ fontSize: 12, whiteSpace: "nowrap" }}>
                  New note
                </Button>
              </Stack>

              {/* filter row */}
              <Stack direction="row" spacing={1} alignItems="center" sx={{ mb: 2 }}>
                <FilterChip value="all" label={`All (${notes.length})`} />
                <FilterChip value="call" label={`On a call (${notes.filter((n) => n.callId).length})`} />
                <FilterChip value="standalone" label={`Standalone (${notes.filter((n) => !n.callId).length})`} />
              </Stack>

              {/* list */}
              <Stack spacing={1.25}>
                {visible.map((n) => (
                  <NoteCard
                    key={n.id}
                    note={n}
                    call={n.callId ? callsById[n.callId] : null}
                    expanded={expandedId === n.id}
                    autoFocus={autoEditId === n.id}
                    onToggle={onToggleExpand}
                    onSave={onSaveNote}
                    onOpenCall={onOpenCall}
                  />
                ))}
                {visible.length === 0 && <PreviewCardEmpty text="No notes match your search." />}
              </Stack>
            </Box>
          </PanelWrap>
        );
      };

      // How each call party kind is represented.
      const CALL_PARTY = {
        client: { label: "Client", Icon: PersonIcon, tint: colors.primary, bg: "#F3FAFF" },
        contact: { label: "Contact", Icon: GroupOutlinedIcon, tint: "#00897b", bg: "#e6f4f2" },
        third_party: { label: "Third party", Icon: StorefrontOutlinedIcon, tint: "#ef6c00", bg: "#fff3e0" },
      };

      // Direction badge: outgoing (call made) vs incoming (call received).
      const CallDirection = ({ direction }) => {
        const outgoing = direction === "outgoing";
        const Icon = outgoing ? CallMadeIcon : CallReceivedIcon;
        const tint = outgoing ? colors.labelText : colors.green;
        return (
          <Stack direction="row" spacing={0.4} alignItems="center" sx={{ flexShrink: 0 }}>
            <Icon sx={{ fontSize: 14, color: tint }} />
            <Typography sx={{ fontSize: 12, fontWeight: 500, color: tint }}>
              {outgoing ? "Outgoing" : "Incoming"}
            </Typography>
          </Stack>
        );
      };

      // Party pill: who the call was with + their kind.
      const PartyPill = ({ party }) => {
        const meta = CALL_PARTY[party.kind] || CALL_PARTY.client;
        const { Icon } = meta;
        return (
          <Chip
            size="small"
            icon={<Icon sx={{ fontSize: "13px !important", color: meta.tint + " !important" }} />}
            label={party.name}
            sx={{
              height: 20,
              fontSize: 11,
              fontWeight: 500,
              color: meta.tint,
              backgroundColor: meta.bg,
              "& .MuiChip-icon": { ml: "5px" },
              "& .MuiChip-label": { px: "6px" },
            }}
          />
        );
      };

      // Per-medium presentation for the communication thread.
      const COMM_MEDIUM = {
        call: { label: "Call", Icon: PhoneInTalkIcon, tint: colors.green, bg: "#eef7ef" },
        text: { label: "Text", Icon: SmsOutlinedIcon, tint: colors.primary, bg: "#F3FAFF" },
        email: { label: "Email", Icon: EmailOutlinedIcon, tint: "#9164ff", bg: "#f3eeff" },
      };

      // One row in the unified communication thread.
      const CommItem = ({ item, note, onOpen }) => {
        const medium = COMM_MEDIUM[item.medium];
        const { Icon } = medium;
        const preview =
          item.medium === "call"
            ? note?.body || null
            : item.body;
        return (
          <Stack direction="row" spacing={1.5} alignItems="flex-start">
            {/* medium marker */}
            <Box
              sx={{
                width: 34,
                height: 34,
                borderRadius: "50%",
                backgroundColor: medium.bg,
                display: "flex",
                alignItems: "center",
                justifyContent: "center",
                flexShrink: 0,
                mt: 0.25,
              }}
            >
              <Icon sx={{ fontSize: 18, color: medium.tint }} />
            </Box>

            <Box sx={{ flex: 1, minWidth: 0 }}>
              <PreviewCard title={item.when} onClick={() => onOpen(item)}>
                <Stack direction="row" spacing={1} alignItems="center" sx={{ width: "100%", flexWrap: "wrap", gap: 0.75 }}>
                  <Typography sx={{ fontSize: 12, fontWeight: 600, color: medium.tint }}>{medium.label}</Typography>
                  <CallDirection direction={item.direction} />
                  <PartyPill party={item.party} />
                  <Box sx={{ flex: 1 }} />
                  {item.medium === "call" && (
                    <Typography sx={{ fontSize: 12, color: colors.labelText }}>
                      {item.outcome} · {item.duration}
                    </Typography>
                  )}
                </Stack>
                {item.subject && (
                  <Typography sx={{ fontSize: 13, fontWeight: 600, color: colors.primaryText, textAlign: "left", width: "100%" }}>
                    {item.subject}
                  </Typography>
                )}
                {preview ? (
                  <Typography
                    sx={{
                      fontSize: 13,
                      color: colors.secondaryText,
                      display: "-webkit-box",
                      WebkitLineClamp: 2,
                      WebkitBoxOrient: "vertical",
                      overflow: "hidden",
                      textAlign: "left",
                      width: "100%",
                    }}
                  >
                    {preview}
                  </Typography>
                ) : (
                  item.medium === "call" && (
                    <Typography sx={{ fontSize: 12, color: colors.mutedText, fontStyle: "italic", textAlign: "left", width: "100%" }}>
                      No note attached
                    </Typography>
                  )
                )}
              </PreviewCard>
            </Box>
          </Stack>
        );
      };

      const COMM_FILTERS = {
        all: { label: "All", test: () => true },
        call: { label: "Calls", test: (i) => i.medium === "call" },
        text: { label: "Texts", test: (i) => i.medium === "text" },
        email: { label: "Emails", test: (i) => i.medium === "email" },
      };

      const CommunicationPanel = ({ calls, messages, notes, onOpen }) => {
        const [filter, setFilter] = useState("all");
        // Merge every medium and sort as one chronological thread (newest first).
        const thread = useMemo(
          () => [...calls, ...messages].sort((a, b) => b.ts - a.ts),
          [calls, messages],
        );
        const visible = thread.filter(COMM_FILTERS[filter].test);

        const FilterChip = ({ value }) => {
          const count = value === "all" ? thread.length : thread.filter(COMM_FILTERS[value].test).length;
          return (
            <Chip
              size="small"
              label={`${COMM_FILTERS[value].label} (${count})`}
              onClick={() => setFilter(value)}
              variant={filter === value ? "filled" : "outlined"}
              sx={{
                height: 26,
                fontSize: 12,
                borderRadius: "4px",
                cursor: "pointer",
                ...(filter === value
                  ? { backgroundColor: colors.selectedBg, color: colors.primary, border: `1px solid ${colors.primary}` }
                  : { color: colors.labelText, borderColor: colors.border }),
              }}
            />
          );
        };

        return (
          <PanelWrap>
            <Box sx={{ maxWidth: 720 }}>
              <Stack direction="row" spacing={1} alignItems="center" sx={{ mb: 2 }}>
                {Object.keys(COMM_FILTERS).map((k) => (
                  <FilterChip key={k} value={k} />
                ))}
              </Stack>
              <Stack spacing={1.25}>
                {visible.map((item) => (
                  <CommItem
                    key={item.id}
                    item={item}
                    note={item.medium === "call" ? notes.find((n) => n.callId === item.id) : null}
                    onOpen={onOpen}
                  />
                ))}
              </Stack>
            </Box>
          </PanelWrap>
        );
      };

      const TasksPanel = ({ tasks, onToggle, onOpenTask }) => (
        <PanelWrap>
          <Box sx={{ maxWidth: 720 }}>
            <Stack direction="row" justifyContent="space-between" alignItems="center" sx={{ mb: 2 }}>
              <SectionLabel>Tasks</SectionLabel>
              <Button size="small" startIcon={<AddIcon />} sx={{ fontSize: 11, color: colors.primary }}>New task</Button>
            </Stack>
            <Stack spacing={1}>
              {tasks.map((t) => (
                <Box
                  key={t.id}
                  sx={{
                    display: "flex",
                    alignItems: "flex-start",
                    gap: 1.25,
                    border: `1px solid ${colors.lightBorder}`,
                    borderRadius: "3px",
                    p: 1.5,
                    cursor: "pointer",
                    "&:hover": { backgroundColor: colors.cardHoverBg, borderColor: colors.cardHoverBorder },
                  }}
                  onClick={() => onOpenTask(t)}
                >
                  <IconButton
                    size="small"
                    sx={{ p: 0, mt: "1px" }}
                    onClick={(e) => { e.stopPropagation(); onToggle(t.id); }}
                  >
                    {t.status === "done" ? (
                      <CheckCircleOutlineIcon sx={{ color: colors.green, fontSize: 20 }} />
                    ) : (
                      <RadioButtonUncheckedIcon sx={{ color: colors.mutedText, fontSize: 20 }} />
                    )}
                  </IconButton>
                  <Box sx={{ flex: 1, minWidth: 0 }}>
                    <Typography
                      sx={{
                        fontSize: 14,
                        fontWeight: 500,
                        color: colors.primaryText,
                        textDecoration: t.status === "done" ? "line-through" : "none",
                      }}
                    >
                      {t.title}
                    </Typography>
                    <Stack direction="row" spacing={1.5} alignItems="center" sx={{ mt: 0.75 }}>
                      <StatusChip status={t.status} label={t.statusLabel} />
                      <Stack direction="row" spacing={0.5} alignItems="center">
                        <UserAvatar name={t.assignee} colorSeed={t.assignee} sx={{ width: 18, height: 18, fontSize: 8 }} />
                        <Typography sx={{ fontSize: 12, color: colors.labelText }}>{t.assignee}</Typography>
                      </Stack>
                      <Typography sx={{ fontSize: 12, color: colors.timestampText }}>Due {t.due}</Typography>
                    </Stack>
                  </Box>
                </Box>
              ))}
            </Stack>
          </Box>
        </PanelWrap>
      );

      const DocumentsPanel = () => (
        <PanelWrap>
          <Box sx={{ maxWidth: 720 }}>
            <Box
              sx={{
                border: `1.5px dashed ${colors.border}`,
                borderRadius: "6px",
                p: 3,
                mb: 3,
                textAlign: "center",
                color: colors.labelText,
                backgroundColor: colors.emptyCardBg,
              }}
            >
              <UploadFileIcon sx={{ fontSize: 28, color: colors.mutedText }} />
              <Typography sx={{ fontSize: 13, mt: 0.5 }}>Drag &amp; drop files here, or click to upload</Typography>
            </Box>
            <Stack spacing={1.25}>
              {DOCUMENTS.map((d) => (
                <Stack
                  key={d.id}
                  direction="row"
                  spacing={1.5}
                  alignItems="center"
                  sx={{
                    border: `1px solid ${colors.lightBorder}`,
                    borderRadius: "3px",
                    p: 1.5,
                    cursor: "pointer",
                    "&:hover": { backgroundColor: colors.cardHoverBg, borderColor: colors.cardHoverBorder },
                  }}
                >
                  <DescriptionOutlinedIcon sx={{ color: colors.primary }} />
                  <Box sx={{ flex: 1, minWidth: 0 }}>
                    <Typography sx={{ fontSize: 14, fontWeight: 500, color: colors.primaryText }}>{d.name}</Typography>
                    <Typography sx={{ fontSize: 12, color: colors.labelText }}>{d.size} · {d.by} · {d.when}</Typography>
                  </Box>
                  <EastIcon sx={{ fontSize: 16, color: colors.labelText }} />
                </Stack>
              ))}
            </Stack>
          </Box>
        </PanelWrap>
      );

      // ===================================================================
      // RIGHT PANE CONTENTS
      // ===================================================================
      const PaneHeader = ({ title, onClose }) => (
        <Stack
          direction="row"
          alignItems="center"
          justifyContent="space-between"
          sx={{ px: 2, py: 1.25, borderBottom: `1px solid ${colors.lightBorder}`, flexShrink: 0 }}
        >
          <Typography sx={{ fontSize: 14, fontWeight: 600, color: colors.primaryText }}>{title}</Typography>
          <IconButton size="small" onClick={onClose}><CloseIcon fontSize="small" /></IconButton>
        </Stack>
      );

      // Compact call-controls strip shown at the top of the Next-call pane
      // while a call is live.
      const CallControls = ({ onEnd }) => {
        const [seconds, setSeconds] = useState(0);
        const [muted, setMuted] = useState(false);
        useEffect(() => {
          const id = setInterval(() => setSeconds((s) => s + 1), 1000);
          return () => clearInterval(id);
        }, []);
        const mmss = `${String(Math.floor(seconds / 60)).padStart(2, "0")}:${String(seconds % 60).padStart(2, "0")}`;
        return (
          <Box sx={{ p: 2, borderBottom: `1px solid ${colors.lightBorder}`, flexShrink: 0, backgroundColor: "#f8fdf8" }}>
            <Stack direction="row" spacing={1.25} alignItems="center">
              <UserAvatar name={CLIENT.name} colorSeed={CLIENT.name} sx={{ width: 40, height: 40, fontSize: 15 }} />
              <Box sx={{ flex: 1, minWidth: 0 }}>
                <Typography sx={{ fontSize: 14, fontWeight: 600, color: colors.primaryText, lineHeight: 1.2 }}>{CLIENT.name}</Typography>
                <Stack direction="row" spacing={0.5} alignItems="center">
                  <Box sx={{ width: 7, height: 7, borderRadius: "50%", backgroundColor: colors.green }} />
                  <Typography sx={{ fontSize: 12, fontWeight: 600, color: colors.green }}>Connected · {mmss}</Typography>
                </Stack>
              </Box>
              <Tooltip title={muted ? "Unmute" : "Mute"}>
                <IconButton
                  size="small"
                  onClick={() => setMuted((m) => !m)}
                  sx={{ border: `1px solid ${colors.border}`, backgroundColor: muted ? "#FFCDD2" : "transparent" }}
                >
                  {muted ? <MicOffIcon fontSize="small" /> : <MicIcon fontSize="small" />}
                </IconButton>
              </Tooltip>
              <Tooltip title="Keypad">
                <IconButton size="small" sx={{ border: `1px solid ${colors.border}` }}><DialpadIcon fontSize="small" /></IconButton>
              </Tooltip>
              <Tooltip title="End call">
                <IconButton
                  size="small"
                  onClick={onEnd}
                  sx={{ backgroundColor: colors.red, color: "#fff", "&:hover": { backgroundColor: "#b71c1c" } }}
                >
                  <CallEndIcon fontSize="small" />
                </IconButton>
              </Tooltip>
            </Stack>
          </Box>
        );
      };

      // Persistent "Next call" note pane. Between calls it's a working plan
      // the guide builds up from research across many notes. During a call it
      // becomes the live outline + capture surface. On end call it's archived
      // as a historical call note and reset to a fresh blank plan.
      const NextCallPane = ({ note, onChange, onClose, onStartCall, onEndCall, callActive }) => {
        const bodyRef = useRef(null);
        useEffect(() => {
          if (callActive && bodyRef.current) {
            const el = bodyRef.current.querySelector("textarea");
            if (el) el.focus();
          }
        }, [callActive]);

        return (
          <>
            {/* header */}
            <Stack
              direction="row"
              alignItems="center"
              justifyContent="space-between"
              sx={{ px: 2, py: 1.25, borderBottom: `1px solid ${colors.lightBorder}`, flexShrink: 0 }}
            >
              <Stack direction="row" alignItems="center" spacing={1}>
                <UpcomingIcon sx={{ fontSize: 18, color: callActive ? colors.green : colors.primary }} />
                <Typography sx={{ fontSize: 14, fontWeight: 600, color: colors.primaryText }}>
                  {callActive ? "On call · working note" : "Next call"}
                </Typography>
              </Stack>
              <Tooltip title="Collapse panel">
                <IconButton size="small" onClick={onClose}><ChevronRightIcon fontSize="small" /></IconButton>
              </Tooltip>
            </Stack>

            {callActive && <CallControls onEnd={onEndCall} />}

            {/* the working document (title + body, Notion-style) */}
            <Box sx={{ px: 2, pt: 1.5, pb: 2, display: "flex", flexDirection: "column", flex: 1, minHeight: 0 }}>
              {!callActive && (
                <Typography sx={{ fontSize: 11.5, color: colors.labelText, mb: 1.5, lineHeight: 1.5 }}>
                  Draft the outline for your next conversation here. It stays with you as you
                  browse the profile, and becomes the live note when you start the call.
                </Typography>
              )}
              <Box ref={bodyRef} sx={{ flex: 1, minHeight: 0, display: "flex" }}>
                <TextField
                  variant="standard"
                  placeholder={"• Topics to cover\n• Questions to ask\n• Updates to share…"}
                  value={note.body}
                  onChange={(e) => onChange({ body: e.target.value })}
                  fullWidth
                  multiline
                  InputProps={{ disableUnderline: true }}
                  sx={{
                    flex: 1,
                    "& .MuiInputBase-root": { alignItems: "flex-start", height: "100%" },
                    "& .MuiInputBase-input": { fontSize: 14, color: colors.primaryText, lineHeight: 1.6, height: "100% !important", overflow: "auto !important" },
                    "& .MuiInputBase-input::placeholder": { color: colors.mutedText, opacity: 1 },
                  }}
                />
              </Box>

              {callActive ? (
                <Button variant="contained" color="error" startIcon={<CallEndIcon />} sx={{ mt: 1.5, fontSize: 12 }} onClick={onEndCall}>
                  End call &amp; archive note
                </Button>
              ) : (
                <Button variant="contained" color="success" startIcon={<PhoneIcon />} sx={{ mt: 1.5, fontSize: 12 }} onClick={onStartCall}>
                  Start call with this plan
                </Button>
              )}
            </Box>
          </>
        );
      };

      const CallDetailPane = ({ call, note, onClose, onOpenNote }) => {
        const partyMeta = CALL_PARTY[call.party.kind] || CALL_PARTY.client;
        return (
          <>
            <PaneHeader title="Call detail" onClose={onClose} />
            <Box sx={{ p: 2, display: "flex", flexDirection: "column", gap: 1.5, overflowY: "auto" }}>
              <Stack direction="row" spacing={1} alignItems="center">
                <CallDirection direction={call.direction} />
                <Typography sx={{ fontSize: 12, color: colors.mutedText }}>·</Typography>
                <Typography sx={{ fontSize: 12, color: colors.labelText }}>{partyMeta.label}</Typography>
              </Stack>
              <Stack direction="row" spacing={1.25} alignItems="center">
                <Box sx={{ width: 36, height: 36, borderRadius: "50%", backgroundColor: partyMeta.bg, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                  <partyMeta.Icon sx={{ fontSize: 20, color: partyMeta.tint }} />
                </Box>
                <Typography sx={{ fontSize: 17, fontWeight: 700, color: colors.primaryText }}>{call.party.name}</Typography>
              </Stack>
              <InfoRow label="When" value={call.when} />
              <InfoRow label="Duration" value={call.duration} />
              <InfoRow label="Outcome" value={call.outcome} />
              <Divider sx={{ borderColor: colors.lightBorder }} />
              <Stack direction="row" alignItems="center" justifyContent="space-between">
                <SectionLabel>Attached note</SectionLabel>
                {note && (
                  <ButtonBase
                    onClick={() => onOpenNote(note)}
                    sx={{ display: "inline-flex", alignItems: "center", gap: 0.5, fontSize: 12, fontWeight: 500, color: colors.primary }}
                  >
                    Open in Notes <EastIcon sx={{ fontSize: 13 }} />
                  </ButtonBase>
                )}
              </Stack>
              {note ? (
                <Box sx={{ border: `1px solid ${colors.lightBorder}`, borderRadius: "3px", p: 1.5 }}>
                  <Typography sx={{ fontSize: 11.5, color: colors.labelText, mb: 1 }}>
                    {note.author} · {note.updatedWhen}
                  </Typography>
                  <Typography sx={{ fontSize: 14, color: colors.primaryText, lineHeight: 1.6, whiteSpace: "pre-wrap" }}>{note.body}</Typography>
                </Box>
              ) : (
                <PreviewCardEmpty text="No note attached to this call." />
              )}
            </Box>
          </>
        );
      };

      const MessageDetailPane = ({ message, onClose }) => {
        const medium = COMM_MEDIUM[message.medium];
        const partyMeta = CALL_PARTY[message.party.kind] || CALL_PARTY.client;
        return (
          <>
            <PaneHeader title={medium.label + " detail"} onClose={onClose} />
            <Box sx={{ p: 2, display: "flex", flexDirection: "column", gap: 1.5, overflowY: "auto" }}>
              <Stack direction="row" spacing={1} alignItems="center">
                <medium.Icon sx={{ fontSize: 16, color: medium.tint }} />
                <Typography sx={{ fontSize: 12, fontWeight: 600, color: medium.tint }}>{medium.label}</Typography>
                <Typography sx={{ fontSize: 12, color: colors.mutedText }}>·</Typography>
                <CallDirection direction={message.direction} />
              </Stack>
              <Stack direction="row" spacing={1.25} alignItems="center">
                <Box sx={{ width: 36, height: 36, borderRadius: "50%", backgroundColor: partyMeta.bg, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                  <partyMeta.Icon sx={{ fontSize: 20, color: partyMeta.tint }} />
                </Box>
                <Box>
                  <Typography sx={{ fontSize: 16, fontWeight: 700, color: colors.primaryText, lineHeight: 1.2 }}>{message.party.name}</Typography>
                  <Typography sx={{ fontSize: 11.5, color: colors.labelText }}>
                    {message.direction === "outgoing" ? "To" : "From"} · {partyMeta.label}
                  </Typography>
                </Box>
              </Stack>
              <InfoRow label="When" value={message.when} />
              {message.subject && <InfoRow label="Subject" value={message.subject} />}
              <Divider sx={{ borderColor: colors.lightBorder }} />
              <SectionLabel>{message.medium === "email" ? "Message" : "Transcript"}</SectionLabel>
              <Box sx={{ border: `1px solid ${colors.lightBorder}`, borderRadius: "3px", p: 1.5 }}>
                <Typography sx={{ fontSize: 14, color: colors.primaryText, lineHeight: 1.6, whiteSpace: "pre-wrap" }}>
                  {message.body}
                </Typography>
              </Box>
            </Box>
          </>
        );
      };

      const TaskDetailPane = ({ task, onClose, onToggle }) => (
        <>
          <PaneHeader title="Task" onClose={onClose} />
          <Box sx={{ p: 2, display: "flex", flexDirection: "column", gap: 1.75 }}>
            <Typography sx={{ fontSize: 20, fontWeight: 700, color: colors.primaryText }}>{task.title}</Typography>
            <Stack direction="row" spacing={2} alignItems="center">
              <StatusChip status={task.status} label={task.statusLabel} />
              <Button size="small" onClick={() => onToggle(task.id)} sx={{ fontSize: 11 }}>
                {task.status === "done" ? "Reopen" : "Mark done"}
              </Button>
            </Stack>
            <Divider sx={{ borderColor: colors.lightBorder }} />
            <Stack direction="row" spacing={4}>
              <Box>
                <SectionLabel>Assignee</SectionLabel>
                <Stack direction="row" spacing={0.75} alignItems="center" sx={{ mt: 0.5 }}>
                  <UserAvatar name={task.assignee} colorSeed={task.assignee} sx={{ width: 20, height: 20, fontSize: 8 }} />
                  <Typography sx={bodyValueSx}>{task.assignee}</Typography>
                </Stack>
              </Box>
              <Box>
                <SectionLabel>Due</SectionLabel>
                <Typography sx={{ ...bodyValueSx, mt: 0.5 }}>{task.due}</Typography>
              </Box>
            </Stack>
            <Divider sx={{ borderColor: colors.lightBorder }} />
            <SectionLabel>Detail</SectionLabel>
            <Typography sx={{ fontSize: 14, color: colors.primaryText, lineHeight: 1.6 }}>{task.detail}</Typography>
          </Box>
        </>
      );

      // ===================================================================
      // APP SHELL
      // ===================================================================
      const TABS = [
        { key: "overview", label: "Overview", icon: <DashboardOutlinedIcon fontSize="small" /> },
        { key: "activity", label: "Feed", icon: <HistoryIcon fontSize="small" /> },
        { key: "notes", label: "Notes", icon: <NotesIcon fontSize="small" /> },
        { key: "comms", label: "Communication", icon: <ForumOutlinedIcon fontSize="small" /> },
        { key: "tasks", label: "Tasks", icon: <AssignmentOutlinedIcon fontSize="small" /> },
        { key: "documents", label: "Documents", icon: <FolderOpenIcon fontSize="small" /> },
      ];

      function App() {
        const [tab, setTab] = useState("overview");
        const [tasks, setTasks] = useState(TASKS);
        const [notes, setNotes] = useState(NOTES);
        const [calls, setCalls] = useState(CALLS);
        const [messages, setMessages] = useState(MESSAGES);
        // right pane: { type: 'call' | 'note' | 'callDetail' | 'taskDetail', data }
        const [pane, setPane] = useState(null);
        const [toast, setToast] = useState("");
        // Inline expand/edit state for the notes list.
        const [expandedNoteId, setExpandedNoteId] = useState(null);
        const [autoEditNoteId, setAutoEditNoteId] = useState(null);

        // Persistent "Next call" working note. Survives tab navigation and
        // pane open/close. During a call it doubles as the live capture note.
        const NEXT_CALL_SEED = {
          title: "Prep · benefits & mobility follow-ups",
          body:
            "TOPICS TO COVER\n• Knee MRI claim — retro PA approved, corrected claim reprocessing (from “Knee MRI claim” note)\n• Transportation — share the 2 NEMT options I found (see “Transportation options” research)\n• Mobility aids — walker vs. rollator; confirm DME coverage\n\nQUESTIONS TO ASK\n• Has the corrected EOB arrived in the mail yet?\n• Is she comfortable scheduling the Annual Wellness Visit now?\n• Any falls or mobility concerns since last call?\n\nUPDATES TO SHARE\n• Dental: $2,000/yr allowance confirmed — can book cleaning anytime",
        };
        const [nextCallNote, setNextCallNote] = useState(NEXT_CALL_SEED);
        const [nextCallOpen, setNextCallOpen] = useState(true);
        const [activeCallId, setActiveCallId] = useState(null); // set while a call is live

        const callsById = useMemo(
          () => Object.fromEntries(calls.map((c) => [c.id, c])),
          [calls],
        );

        const findNote = (id) => notes.find((n) => n.id === id);
        const findCall = (id) => calls.find((c) => c.id === id);
        const noteForCall = (callId) => notes.find((n) => n.callId === callId);

        const toggleTask = (id) =>
          setTasks((ts) =>
            ts.map((t) =>
              t.id === id
                ? t.status === "done"
                  ? { ...t, status: "in_progress", statusLabel: "In progress" }
                  : { ...t, status: "done", statusLabel: "Done" }
                : t,
            ),
          );

        // --- Notes CRUD ---------------------------------------------------
        // Autosave silently on each change (Notion-style) — no toast spam.
        const saveNote = (id, patch) => {
          setNotes((ns) =>
            ns.map((n) =>
              n.id === id
                ? { ...n, ...patch, updatedWhen: "just now", updatedTs: Date.now() }
                : n,
            ),
          );
        };
        const newNote = () => {
          const id = "note-" + Date.now();
          const note = {
            id,
            title: "Untitled note",
            author: "Marcus Bell",
            createdWhen: "just now",
            updatedWhen: "just now",
            updatedTs: Date.now(),
            callId: null,
            body: "",
            versions: [],
          };
          setNotes((ns) => [note, ...ns]);
          setTab("notes");
          setExpandedNoteId(id);
          setAutoEditNoteId(id);
        };
        const toggleExpand = (id) => {
          setExpandedNoteId((cur) => (cur === id ? null : id));
          setAutoEditNoteId(null);
        };
        // Open a note inline in the center list (from activity / call detail).
        const openNoteInline = (note) => {
          setTab("notes");
          setExpandedNoteId(note.id);
          setAutoEditNoteId(null);
        };

        // --- Next call working note --------------------------------------
        const changeNextCall = (patch) =>
          setNextCallNote((n) => ({ ...n, ...patch }));
        const openNextCall = () => setNextCallOpen(true);
        const closeNextCall = () => setNextCallOpen(false);

        // --- Calls --------------------------------------------------------
        // Starting a call turns the Next-call plan into the live working note.
        const startCall = () => {
          setActiveCallId("call-" + Date.now());
          setPane(null); // give the working note the whole right pane
          setNextCallOpen(true);
        };
        // Ending a call archives the working note as a historical, call-attached
        // note, then resets the Next-call note to a fresh blank plan.
        const endCall = () => {
          if (activeCallId) {
            const now = Date.now();
            const callRecord = {
              id: activeCallId,
              medium: "call",
              direction: "outgoing",
              party: { name: CLIENT.name, kind: "client" },
              when: "just now",
              ts: now,
              duration: "—",
              outcome: "Connected",
            };
            setCalls((cs) => [callRecord, ...cs]);
            const callNote = {
              id: "note-" + now,
              title: "", // call notes are date-only, no title
              author: "Marcus Bell",
              createdWhen: "just now",
              updatedWhen: "just now",
              updatedTs: now,
              callId: activeCallId,
              body: nextCallNote.body || "",
              versions: [],
            };
            setNotes((ns) => [callNote, ...ns]);
          }
          setActiveCallId(null);
          // Clear the working note into a fresh blank plan for the next call.
          setNextCallNote({ title: "", body: "" });
          setNextCallOpen(true);
          setToast("Call archived to Notes · Next-call plan cleared");
        };
        const closePane = () => setPane(null);
        const callActive = !!activeCallId;

        // Jump from an activity item to its source. Notes open inline in the
        // center list; calls/tasks open in the right pane.
        const navigateToSource = (source) => {
          if (!source) return;
          if (source.kind === "note") {
            const note = findNote(source.id);
            if (note) openNoteInline(note);
          } else if (source.kind === "call") {
            setTab("comms");
            setPane({ type: "callDetail", data: findCall(source.id) });
          } else if (source.kind === "task") {
            setTab("tasks");
            const task = tasks.find((t) => t.id === source.id);
            if (task) setPane({ type: "taskDetail", data: task });
          } else if (source.kind === "document") {
            setTab("documents");
            setToast("Opened " + (findDoc(source.id)?.name || "document"));
          }
        };

        const openCallDetail = (call) => {
          setTab("comms");
          setPane({ type: "callDetail", data: call });
        };

        // Open any communication item: calls -> call detail, texts/emails -> message detail.
        const openComm = (item) => {
          if (item.medium === "call") setPane({ type: "callDetail", data: item });
          else setPane({ type: "messageDetail", data: item });
        };

        // Right-side resolution:
        //  - during a call, the working note owns the right pane
        //  - otherwise a transient detail pane (call/task) takes precedence
        //  - otherwise the persistent Next-call pane shows if open
        const showDetailPane = !callActive && !!pane;
        const showNextCall = callActive || (!pane && nextCallOpen);
        const rightWidth = showNextCall ? 440 : showDetailPane ? 440 : 0;

        return (
          <Box sx={{ height: "100%", display: "flex", flexDirection: "column" }}>
            {/* Top bar */}
            <Box
              sx={{
                height: 44,
                flexShrink: 0,
                display: "flex",
                alignItems: "center",
                px: 2,
                borderBottom: `1px solid ${colors.lightBorder}`,
                gap: 1.5,
              }}
            >
              <Typography sx={{ fontSize: 15, fontWeight: 700, color: colors.primary, letterSpacing: 0.5 }}>ez</Typography>
              <Divider orientation="vertical" flexItem sx={{ borderColor: colors.lightBorder }} />
              <Typography sx={{ fontSize: 13, color: colors.labelText }}>Client Profile</Typography>
              <Box sx={{ flex: 1 }} />
              <Chip size="small" label="Prototype" sx={{ fontSize: 10, height: 20, backgroundColor: "#F3FAFF", color: colors.primary }} />
            </Box>

            {/* Body: left sidebar | center tabs | right pane */}
            <Box sx={{ flex: 1, display: "flex", minHeight: 0, position: "relative" }}>
              <LeftSidebar
                onStartCall={startCall}
                onStartText={() => setToast("Texting is stubbed in this prototype")}
                callActive={callActive}
                nextCallOpen={showNextCall}
                onToggleNextCall={() => {
                  if (pane) { setPane(null); setNextCallOpen(true); }
                  else setNextCallOpen((o) => !o);
                }}
              />

              {/* Center */}
              <Box sx={{ flex: 1, minWidth: 0, display: "flex", flexDirection: "column" }}>
                <Tabs
                  value={tab}
                  onChange={(_, v) => setTab(v)}
                  variant="scrollable"
                  scrollButtons={false}
                  sx={{
                    borderBottom: `1px solid ${colors.lightBorder}`,
                    px: 1,
                    minHeight: 44,
                    "& .MuiTab-root": { minHeight: 44, minWidth: "auto", px: 2, fontSize: 13 },
                  }}
                >
                  {TABS.map((t) => (
                    <Tab
                      key={t.key}
                      value={t.key}
                      iconPosition="start"
                      icon={t.icon}
                      label={
                        t.key === "tasks"
                          ? <Badge color="primary" badgeContent={tasks.filter((x) => x.status !== "done").length} sx={{ "& .MuiBadge-badge": { position: "static", transform: "none", ml: 0.75, fontSize: 10, height: 16, minWidth: 16 } }}>Tasks</Badge>
                          : t.label
                      }
                    />
                  ))}
                </Tabs>

                <Box sx={{ flex: 1, minHeight: 0 }}>
                  {tab === "overview" && (
                    <OverviewPanel
                      onAction={(label) => setToast(label + " — stubbed in this prototype")}
                      onGoTab={(t) => setTab(t)}
                    />
                  )}
                  {tab === "activity" && <FeedPanel onNavigate={navigateToSource} />}
                  {tab === "notes" && (
                    <NotesPanel
                      notes={notes}
                      callsById={callsById}
                      expandedId={expandedNoteId}
                      autoEditId={autoEditNoteId}
                      onToggleExpand={toggleExpand}
                      onSaveNote={saveNote}
                      onNewNote={newNote}
                      onOpenCall={openCallDetail}
                    />
                  )}
                  {tab === "comms" && (
                    <CommunicationPanel calls={calls} messages={messages} notes={notes} onOpen={openComm} />
                  )}
                  {tab === "tasks" && <TasksPanel tasks={tasks} onToggle={toggleTask} onOpenTask={(t) => setPane({ type: "taskDetail", data: t })} />}
                  {tab === "documents" && <DocumentsPanel />}
                </Box>
              </Box>

              {/* Reopen tab for the collapsed Next-call pane */}
              {!showNextCall && !showDetailPane && !nextCallOpen && (
                <Tooltip title="Open Next-call note" placement="left">
                  <Box
                    onClick={openNextCall}
                    sx={{
                      position: "absolute",
                      right: 0,
                      top: 120,
                      display: "flex",
                      alignItems: "center",
                      gap: 0.5,
                      px: 1,
                      py: 1.25,
                      borderTopLeftRadius: 6,
                      borderBottomLeftRadius: 6,
                      backgroundColor: colors.primary,
                      color: "#fff",
                      cursor: "pointer",
                      boxShadow: "0px 2px 8px #0000002A",
                      writingMode: "vertical-rl",
                      "&:hover": { backgroundColor: "#0d4a94" },
                    }}
                  >
                    <UpcomingIcon sx={{ fontSize: 16, transform: "rotate(90deg)" }} />
                    <Typography sx={{ fontSize: 12, fontWeight: 600 }}>Next call</Typography>
                  </Box>
                </Tooltip>
              )}

              {/* Right pane */}
              <RightPane open={showNextCall || showDetailPane} width={rightWidth}>
                {showNextCall && (
                  <NextCallPane
                    note={nextCallNote}
                    onChange={changeNextCall}
                    onClose={closeNextCall}
                    onStartCall={startCall}
                    onEndCall={endCall}
                    callActive={callActive}
                  />
                )}
                {showDetailPane && pane?.type === "callDetail" && (
                  <CallDetailPane
                    call={pane.data}
                    note={noteForCall(pane.data.id)}
                    onClose={closePane}
                    onOpenNote={openNoteInline}
                  />
                )}
                {showDetailPane && pane?.type === "messageDetail" && (
                  <MessageDetailPane message={pane.data} onClose={closePane} />
                )}
                {showDetailPane && pane?.type === "taskDetail" && (
                  <TaskDetailPane
                    task={tasks.find((t) => t.id === pane.data.id) || pane.data}
                    onClose={closePane}
                    onToggle={toggleTask}
                  />
                )}
              </RightPane>
            </Box>

            <Snackbar
              open={!!toast}
              autoHideDuration={2600}
              onClose={() => setToast("")}
              anchorOrigin={{ vertical: "bottom", horizontal: "center" }}
            >
              <Alert severity="success" variant="filled" onClose={() => setToast("")} sx={{ fontSize: 13 }}>
                {toast}
              </Alert>
            </Snackbar>
          </Box>
        );
      }

      const bootEl = document.getElementById("boot");
      if (bootEl) bootEl.remove();
      createRoot(document.getElementById("root")).render(
        <ThemeProvider theme={theme}>
          <CssBaseline />
          <App />
        </ThemeProvider>,
      );
    </script>
  </body>
</html>
