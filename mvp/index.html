        if (seed === null || seed === undefined || seed === "") return undefined;
        const str = String(seed);
        let hash = 0;
        for (let i = 0; i < str.length; i += 1)
          hash = str.charCodeAt(i) + ((hash << 5) - hash);
        const hue = (Math.abs(hash) * 137.508) % 360;
        return `hsl(${hue}, 55%, 50%)`;
      };

                    <Typography sx={{ fontSize: 12.5, color: colors.labelText }}>Signed consents</Typography>
                    <YesNo value={ins.signedConsents} />
                  </Stack>
                  <KV label="Standard Medicare consent" value={ins.standardConsentSent} />
                  <KV label="Authorization consent" value={ins.authConsentSent} />
                  <Box sx={{ backgroundColor: "#FFF8E1", borderRadius: "3px", p: 1, mt: 0.5 }}>
                    <Typography sx={{ fontSize: 12, color: "#8a6d00", lineHeight: 1.4 }}>
                      <Box component="span" sx={{ fontWeight: 600 }}>Out-of-pocket cost — </Box>
                      {ins.oopNote}
                    </Typography>
                  </Box>
                </Stack>
              </CollapsibleCard>

              {/* CONCRETE WINS */}
              <CollapsibleCard title="Concrete wins" icon={EmojiEventsOutlinedIcon}>
                <Stack spacing={1.5}>
                  {CLIENT.concreteWins.map((w, i) => (
                    <Box key={i}>
                      <Typography sx={{ fontSize: 11.5, color: colors.timestampText, mb: 0.25 }}>{w.when}</Typography>
                      <Typography sx={{ fontSize: 13, color: colors.primaryText, lineHeight: 1.55 }}>{w.text}</Typography>
                    </Box>
                  ))}
                  <Button size="small" startIcon={<AddIcon />} onClick={() => onAction("Record win")} sx={{ fontSize: 11, color: colors.primary, alignSelf: "flex-start" }}>
                    Record win
                  </Button>
                </Stack>
              </CollapsibleCard>

              {/* CARE PLAN */}
              <CollapsibleCard title="Care plan" icon={ArticleOutlinedIcon}>
                <Typography sx={{ fontSize: 13, color: colors.primaryText, lineHeight: 1.6, whiteSpace: "pre-wrap" }}>
                  {CLIENT.carePlan}
                </Typography>
                <Button size="small" startIcon={<EditNoteIcon />} onClick={() => onAction("Edit Care Plan")} sx={{ fontSize: 11, color: colors.primary, mt: 1 }}>
                  Edit care plan
                </Button>
              </CollapsibleCard>

              {/* DIAGNOSES & SDOH CODES */}
              <CollapsibleCard title="Diagnoses & SDOH codes" icon={TagOutlinedIcon}>
                <Stack spacing={1.5}>
                  {CLIENT.sdoh.map((s) => (
                    <Box key={s.code}>
                      <SectionLabel>{s.category}</SectionLabel>
                      <Stack direction="row" spacing={1} sx={{ mt: 0.25 }}>
                        <Typography sx={{ fontSize: 13, fontWeight: 600, color: colors.primary, fontFamily: "monospace", flexShrink: 0 }}>
                          {s.code}
                        </Typography>
                        <Typography sx={{ fontSize: 13, color: colors.primaryText }}>{s.label}</Typography>
                      </Stack>
                    </Box>
                  ))}
                </Stack>
              </CollapsibleCard>

              {/* ELIGIBILITY NOTE SUMMARY */}
              <CollapsibleCard title="Eligibility note summary" icon={AssignmentTurnedInOutlinedIcon} defaultExpanded={false}>
                <Stack spacing={1.25}>
                  <KV label="Date of visit" value={CLIENT.eligibilitySummary.visitDate} />
                  <KV label="Age" value={CLIENT.eligibilitySummary.age} />
                  <KV label="Clinician" value={CLIENT.eligibilitySummary.clinician} />
                  <KV label="Supervising physician" value={CLIENT.eligibilitySummary.supervisingPhysician} />
                  <KV label="Concierge" value={CLIENT.eligibilitySummary.concierge} />
                  <Divider sx={{ borderColor: colors.lightBorder }} />
                  {CLIENT.eligibilitySummary.sections.map((s) => (
                    <Stack key={s} direction="row" spacing={0.5} alignItems="center">
                      <ExpandMoreIcon sx={{ fontSize: 16, color: colors.mutedText, transform: "rotate(-90deg)" }} />
                      <Typography sx={{ fontSize: 13, color: colors.secondaryText }}>{s}</Typography>
                    </Stack>
                  ))}
                </Stack>
              </CollapsibleCard>

              {/* TIME TRACKING */}
              <CollapsibleCard title="Time tracking" icon={TimerOutlinedIcon} defaultExpanded={false}>
                <Stack spacing={1}>
                  <KV label="Logged this month" value={CLIENT.timeTracking.loggedThisMonth} />
                  <KV label="Researcher hrs this month" value={CLIENT.timeTracking.researcherThisMonth} />
                  <KV label="Available this month" value={CLIENT.timeTracking.availableThisMonth} />
                  <KV label="Logged all time" value={CLIENT.timeTracking.loggedAllTime} />
                  <Button size="small" startIcon={<AddIcon />} onClick={() => onAction("Log time block")} sx={{ fontSize: 11, color: colors.primary, alignSelf: "flex-start" }}>
                    Log time block
                  </Button>
                </Stack>
              </CollapsibleCard>

              {/* WELCOME CALL / GIFT */}
              <CollapsibleCard title="Welcome" icon={CardGiftcardIcon} defaultExpanded={false}>
                <Stack spacing={1}>
                  <KV label="Welcome gift sent" value={`${CLIENT.welcomeGift.sentTimes}× · last ${CLIENT.welcomeGift.lastSent}`} />
                  <Stack direction="row" spacing={2}>
                    <ButtonBase onClick={() => onAction("Welcome call plan")} sx={{ fontSize: 12, fontWeight: 500, color: colors.primary }}>
                      Welcome call plan →
                    </ButtonBase>
                    <ButtonBase onClick={() => onAction("Welcome call notes")} sx={{ fontSize: 12, fontWeight: 500, color: colors.primary }}>
                      Welcome call notes →
                    </ButtonBase>
                  </Stack>
                </Stack>
              </CollapsibleCard>

              {/* ADDITIONAL PHONE NUMBERS */}
              <CollapsibleCard title="Additional phone numbers" icon={PhoneIcon} defaultExpanded={false}>
                {CLIENT.additionalPhones.length ? (
                  <Stack spacing={1}>
                    {CLIENT.additionalPhones.map((p) => (
                      <KV key={p} label="Phone" value={p} />
                    ))}
                  </Stack>
                ) : (
                  <Typography sx={{ fontSize: 13, color: colors.mutedText, fontStyle: "italic" }}>
                    No additional numbers.
                  </Typography>
                )}
                <Button size="small" startIcon={<AddIcon />} onClick={() => onAction("Add number")} sx={{ fontSize: 11, color: colors.primary, mt: 1 }}>
                  Add number
                </Button>
              </CollapsibleCard>

              {/* GUIDE HISTORY */}
              <CollapsibleCard title="Guide history" icon={HistoryToggleOffIcon} defaultExpanded={false}>
                <Stack spacing={1}>
                  {CLIENT.guideHistory.map((g) => (
                    <Stack key={g.name} direction="row" spacing={1} alignItems="center">
                      <UserAvatar name={g.name} colorSeed={g.name} sx={{ width: 22, height: 22, fontSize: 9 }} />
                      <Box>
                        <Typography sx={{ fontSize: 13, fontWeight: 500, color: colors.primaryText }}>{g.name}</Typography>
                        <Typography sx={{ fontSize: 11.5, color: colors.labelText }}>{g.range}</Typography>
                      </Box>
                    </Stack>
                  ))}
                </Stack>
              </CollapsibleCard>
            </Box>
          </PanelWrap>
        );
      };

      // --- Activity type config: icon, tint, verb, and source label ---------
      const ACTIVITY_META = {
        research_update: { verb: "updated a note", tint: "#9164ff", bg: "#f3eeff", Icon: EditNoteIcon, cta: "Open note" },
        note: { verb: "added a note", tint: colors.primary, bg: "#F3FAFF", Icon: NotesIcon, cta: "Open note" },
        call: { verb: "logged a call", tint: colors.green, bg: "#eef7ef", Icon: PhoneInTalkIcon, cta: "View in Communication" },
        task_created: { verb: "created a task", tint: "#00897b", bg: "#e6f4f2", Icon: PlaylistAddCheckIcon, cta: "Open task" },
        task_status: { verb: "updated a task", tint: "#00897b", bg: "#e6f4f2", Icon: TaskAltIcon, cta: "Open task" },
        document: { verb: "uploaded a document", tint: "#ef6c00", bg: "#fff3e0", Icon: DescriptionOutlinedIcon, cta: "Open document" },
        system: { verb: "system update", tint: colors.mutedText, bg: colors.emptyCardBg, Icon: SettingsSuggestIcon, cta: null },
      };

      // Highlights just the newly-added text from a note update (no removed
      // content) — a lightweight "what's new" view rather than a full diff.
      const AddedBlock = ({ added = [] }) => (
        <Box
          sx={{
            mt: 1,
            border: `1px solid ${colors.lightBorder}`,
            borderRadius: "3px",
            overflow: "hidden",
            fontSize: 12.5,
            lineHeight: 1.5,
          }}
        >
          {added.map((line, i) => (
            <Box
              key={"a" + i}
              sx={{
                px: 1.25,
                py: 0.5,
                backgroundColor: "#eaf7ec",
                color: "#256b2b",
                borderBottom: i < added.length - 1 ? `1px solid ${colors.lightBorder}` : "none",
              }}
            >
              {line}
            </Box>
          ))}
        </Box>
      );

      // A single feed entry. Collapsed: type marker, headline, and the
      // "what's new" gist (added text for updates, a short preview otherwise).
      // Expanded: reveals the author, full content, and the "go to source" link.
      const FeedItem = ({ item, isLast, onNavigate }) => {
        const [expanded, setExpanded] = useState(false);
        const meta = ACTIVITY_META[item.type];
        const { Icon } = meta;
        const bodyText = item.full || item.preview || null;

        return (
          <Stack direction="row" spacing={1.5} sx={{ position: "relative", pb: 2.5 }}>
            {/* timeline rail */}
            {!isLast && (
              <Box
                sx={{
                  position: "absolute",
                  left: 15,
                  top: 34,
                  bottom: 0,
                  width: "1px",
                  backgroundColor: colors.lightBorder,
                }}
              />
            )}
            {/* type marker */}
            <Box
              sx={{
                width: 32,
                height: 32,
                borderRadius: "50%",
                backgroundColor: meta.bg,
                display: "flex",
                alignItems: "center",
                justifyContent: "center",
                flexShrink: 0,
                zIndex: 1,
              }}
            >
              <Icon sx={{ fontSize: 18, color: meta.tint }} />
            </Box>

            {/* card — click to expand */}
            <Box
              onClick={() => setExpanded((e) => !e)}
              sx={{
                flex: 1,
                minWidth: 0,
                border: `1px solid ${expanded ? colors.cardHoverBorder : colors.lightBorder}`,
                borderRadius: "3px",
                p: 1.5,
                cursor: "pointer",
                "&:hover": { backgroundColor: expanded ? "transparent" : colors.cardHoverBg },
              }}
            >
              {/* header: verb + timestamp (author hidden until expanded) */}
              <Stack direction="row" alignItems="center" spacing={0.75} sx={{ mb: 0.25 }}>
                <Typography sx={{ fontSize: 12.5, color: colors.labelText }}>{meta.verb}</Typography>
                <Box sx={{ flex: 1 }} />
                <Typography sx={{ fontSize: 11, color: colors.timestampText, whiteSpace: "nowrap" }}>{item.when}</Typography>
              </Stack>

              {/* headline / source title */}
              <Typography sx={{ fontSize: 14, fontWeight: 600, color: colors.primaryText, mt: 0.25 }}>
                {item.title}
              </Typography>

              {/* note updates: show summary + the newly added text (green only) */}
              {item.type === "research_update" && (
                <>
                  {item.summary && (
                    <Typography sx={{ fontSize: 12.5, color: colors.labelText, fontStyle: "italic", mt: 0.25 }}>
                      {item.summary}
                    </Typography>
                  )}
                  <AddedBlock added={item.added} />
                </>
              )}

              {item.meta && (
                <Typography sx={{ fontSize: 12.5, color: colors.labelText, mt: 0.25 }}>{item.meta}</Typography>
              )}

              {/* body preview — clamped when collapsed, full when expanded */}
              {bodyText && (
                <Typography
                  sx={{
                    fontSize: 13,
                    color: colors.secondaryText,
                    mt: 0.75,
                    whiteSpace: "pre-wrap",
                    ...(expanded
                      ? {}
                      : {
                          display: "-webkit-box",
                          WebkitLineClamp: 2,
                          WebkitBoxOrient: "vertical",
                          overflow: "hidden",
                        }),
                  }}
                >
                  {bodyText}
                </Typography>
              )}

              {/* expanded-only: author + navigate-to-source */}
              <Collapse in={expanded} timeout="auto" unmountOnExit>
                <Box sx={{ mt: 1.25 }}>
                  <Stack direction="row" spacing={0.75} alignItems="center">
                    <UserAvatar name={item.who} colorSeed={item.who} sx={{ width: 18, height: 18, fontSize: 8 }} />
                    <Typography sx={{ fontSize: 11.5, color: colors.labelText }}>
                      {item.who} · {item.when}
                    </Typography>
                  </Stack>
                  {item.source && meta.cta && (
                    <ButtonBase
                      onClick={(e) => { e.stopPropagation(); onNavigate(item.source); }}
                      sx={{
                        mt: 1,
                        display: "inline-flex",
                        alignItems: "center",
                        gap: 0.5,
                        fontSize: 12,
                        fontWeight: 500,
                        color: colors.primary,
                      }}
                    >
                      {meta.cta}
                      <EastIcon sx={{ fontSize: 13 }} />
                    </ButtonBase>
                  )}
                </Box>
              </Collapse>
            </Box>
          </Stack>
        );
      };

      const FeedPanel = ({ onNavigate }) => (
        <PanelWrap>
          <Box sx={{ maxWidth: 720 }}>
            <Stack direction="row" justifyContent="space-between" alignItems="center" sx={{ mb: 2 }}>
              <SectionLabel>Feed</SectionLabel>
              <Typography sx={mutedTextSx}>{ACTIVITY.length} updates</Typography>
            </Stack>
            {ACTIVITY.map((item, i) => (
              <FeedItem
                key={item.id}
                item={item}
                isLast={i === ACTIVITY.length - 1}
                onNavigate={onNavigate}
              />
            ))}
          </Box>
        </PanelWrap>
      );

      // An inline, expandable + editable note card. Guides can expand a note
      // and edit it in place — e.g. update a research note while the call
      // panel is open on the right and they're taking call notes.
      const NoteCard = ({ note, expanded, onToggle, onSave, onTogglePin, autoFocus }) => {
        // Notion-style: expanding a note drops straight into an editable
        // document. Title + body live on one continuous surface and edits
        // save on change — no separate edit mode or Save/Cancel buttons.
        const [title, setTitle] = useState(note.title);
        const [body, setBody] = useState(note.body);
        const bodyRef = useRef(null);

        // Sync local draft when the underlying note changes externally.
        useEffect(() => { setTitle(note.title); }, [note.title]);
        useEffect(() => { setBody(note.body); }, [note.body]);

        useEffect(() => {
          if (expanded && autoFocus && bodyRef.current) {
            const el = bodyRef.current.querySelector("textarea");
            if (el) el.focus();
          }
        }, [expanded, autoFocus]);

        const commitTitle = (v) => { setTitle(v); onSave(note.id, { title: v }); };
        const commitBody = (v) => { setBody(v); onSave(note.id, { body: v }); };

        return (
          <Box
            sx={{
              border: `1px solid ${expanded ? colors.cardHoverBorder : colors.lightBorder}`,
              borderRadius: "3px",
              overflow: "hidden",
              backgroundColor: "#fff",
            }}
          >
            {/* header row (click to expand). No caret — click anywhere. */}
            <Box
              onClick={() => onToggle(note.id)}
              sx={{
                display: "flex",
                alignItems: "flex-start",
                gap: 1,
                p: 1.5,
                cursor: "pointer",
                "&:hover": { backgroundColor: expanded ? "transparent" : colors.cardHoverBg },
              }}
            >
              <Box sx={{ flex: 1, minWidth: 0 }}>
                <Typography sx={{ fontSize: 14, fontWeight: 600, color: colors.primaryText }}>
                  {note.title || "Untitled note"}
                </Typography>
                {/* Author is hidden until expanded (usually the dedicated guide). */}
                {!expanded && (
                  <Typography
                    sx={{
                      fontSize: 13,
                      color: colors.secondaryText,
                      mt: 0.25,
                      display: "-webkit-box",
                      WebkitLineClamp: 2,
                      WebkitBoxOrient: "vertical",
                      overflow: "hidden",
                      whiteSpace: "pre-wrap",
                    }}
                  >
                    {note.body}
                  </Typography>
                )}
                {!expanded && (
                  <Typography sx={{ fontSize: 11.5, color: colors.timestampText, mt: 0.5 }}>
                    Updated {note.updatedWhen}
                  </Typography>
                )}
              </Box>
              {/* Pin toggle — keep this note open in the side panel */}
              <Tooltip title={note.pinned ? "Unpin" : "Pin to keep open"}>
                <IconButton
                  size="small"
                  onClick={(e) => { e.stopPropagation(); onTogglePin(note.id); }}
                  sx={{ flexShrink: 0, color: note.pinned ? colors.primary : colors.mutedText }}
                >
                  {note.pinned ? <PushPinIcon sx={{ fontSize: 18 }} /> : <PushPinOutlinedIcon sx={{ fontSize: 18 }} />}
                </IconButton>
              </Tooltip>
            </Box>

            {/* expanded: editable Notion-style document */}
            <Collapse in={expanded} timeout="auto" unmountOnExit>
              <Box sx={{ px: 1.5, pb: 1.5, pt: 0 }}>
                <Divider sx={{ borderColor: colors.lightBorder, mb: 0.5 }} />
                {/* Author shown on expand (usually the dedicated guide). */}
                <Stack direction="row" spacing={0.75} alignItems="center" sx={{ my: 1 }}>
                  <UserAvatar name={note.author} colorSeed={note.author} sx={{ width: 18, height: 18, fontSize: 8 }} />
                  <Typography sx={{ fontSize: 11.5, color: colors.labelText }}>
                    {note.author} · updated {note.updatedWhen}
                  </Typography>
                </Stack>
                {/* Single continuous document surface: title + body, borderless. */}
                <Box>
                  <TextField
                    variant="standard"
                    placeholder="Untitled note"
                    value={title}
                    onChange={(e) => commitTitle(e.target.value)}
                    fullWidth
                    InputProps={{ disableUnderline: true }}
                    sx={{
                      "& .MuiInputBase-input": {
                        fontSize: 20,
                        fontWeight: 700,
                        color: colors.primaryText,
                        padding: "2px 0 2px",
                        lineHeight: 1.3,
                      },
                    }}
                  />
                  <TextField
                    ref={bodyRef}
                    variant="standard"
                    placeholder="Start writing…"
                    value={body}
                    onChange={(e) => commitBody(e.target.value)}
                    fullWidth
                    multiline
                    minRows={4}
                    InputProps={{ disableUnderline: true }}
                    sx={{
                      "& .MuiInputBase-input": {
                        fontSize: 14,
                        color: colors.primaryText,
                        lineHeight: 1.6,
                        padding: 0,
                      },
                      "& .MuiInputBase-input::placeholder": { color: colors.mutedText, opacity: 1 },
                    }}
                  />
                </Box>

                {/* subtle footer: pin action + created/edit metadata */}
                <Stack direction="row" spacing={1.5} alignItems="center" sx={{ mt: 1.5 }}>
                  <ButtonBase
                    onClick={(e) => { e.stopPropagation(); onTogglePin(note.id); }}
                    sx={{ display: "inline-flex", alignItems: "center", gap: 0.5, fontSize: 12, fontWeight: 500, color: colors.primary }}
                  >
                    {note.pinned ? <PushPinIcon sx={{ fontSize: 14 }} /> : <PushPinOutlinedIcon sx={{ fontSize: 14 }} />}
                    {note.pinned ? "Pinned — keeping open" : "Pin to keep open"}
                  </ButtonBase>
                  <Typography sx={{ fontSize: 11.5, color: colors.timestampText }}>
                    Created {note.createdWhen}
                    {note.versions && note.versions.length > 0
                      ? ` · ${note.versions.length} edit${note.versions.length === 1 ? "" : "s"}`
                      : ""}
                  </Typography>
                </Stack>
              </Box>
            </Collapse>
          </Box>
        );
      };

      const SORTS = {
        updated: { label: "Recently updated", fn: (a, b) => b.updatedTs - a.updatedTs },
        oldest: { label: "Oldest first", fn: (a, b) => a.updatedTs - b.updatedTs },
        title: { label: "Title (A–Z)", fn: (a, b) => (a.title || "").localeCompare(b.title || "") },
      };

      const NotesPanel = ({
        notes,
        expandedId,
        onToggleExpand,
        onSaveNote,
        onNewNote,
        onTogglePin,
        autoEditId,
      }) => {
        const [q, setQ] = useState("");
        const [sortKey, setSortKey] = useState("updated"); // default: recently updated
        const [sortAnchor, setSortAnchor] = useState(null);

        const visible = useMemo(() => {
          const arr = notes.filter((n) => (n.title + n.body).toLowerCase().includes(q.toLowerCase()));
          return [...arr].sort(SORTS[sortKey].fn);
        }, [notes, q, sortKey]);

        return (
          <PanelWrap>
            <Box sx={{ maxWidth: 720 }}>
              {/* toolbar */}
              <Stack direction="row" spacing={1} alignItems="center" sx={{ mb: 2 }}>
                <TextField
                  size="small"
                  placeholder="Search notes"
                  value={q}
                  onChange={(e) => setQ(e.target.value)}
                  sx={{ flex: 1 }}
                  InputProps={{ startAdornment: (<InputAdornment position="start"><SearchIcon sx={{ color: colors.mutedText, fontSize: 18 }} /></InputAdornment>) }}
                />
                <Button
                  size="small"
                  variant="outlined"
                  endIcon={<UnfoldMoreIcon />}
                  onClick={(e) => setSortAnchor(e.currentTarget)}
                  sx={{ fontSize: 12, whiteSpace: "nowrap", color: colors.secondaryText, borderColor: colors.border }}
                >
                  {SORTS[sortKey].label}
                </Button>
                <Menu anchorEl={sortAnchor} open={!!sortAnchor} onClose={() => setSortAnchor(null)}>
                  {Object.entries(SORTS).map(([key, s]) => (
                    <MenuItem
                      key={key}
                      selected={key === sortKey}
                      onClick={() => { setSortKey(key); setSortAnchor(null); }}
                      sx={{ fontSize: 13 }}
                    >
                      {s.label}
                    </MenuItem>
                  ))}
                </Menu>
                <Button size="small" variant="contained" startIcon={<AddIcon />} onClick={onNewNote} sx={{ fontSize: 12, whiteSpace: "nowrap" }}>
                  New note
                </Button>
              </Stack>

              {/* list */}
              <Stack spacing={1.25}>
                {visible.map((n) => (
                  <NoteCard
                    key={n.id}
                    note={n}
                    expanded={expandedId === n.id}
                    autoFocus={autoEditId === n.id}
                    onToggle={onToggleExpand}
                    onSave={onSaveNote}
                    onTogglePin={onTogglePin}
                  />
                ))}
                {visible.length === 0 && <PreviewCardEmpty text="No notes match your search." />}
              </Stack>
            </Box>
          </PanelWrap>
        );
      };

      // Direction badge: outgoing (call made) vs incoming (call received).
      const CallDirection = ({ direction }) => {
        const outgoing = direction === "outgoing";
        const Icon = outgoing ? CallMadeIcon : CallReceivedIcon;
        const tint = outgoing ? colors.labelText : colors.green;
        return (
          <Stack direction="row" spacing={0.4} alignItems="center" sx={{ flexShrink: 0 }}>
            <Icon sx={{ fontSize: 14, color: tint }} />
            <Typography sx={{ fontSize: 12, fontWeight: 500, color: tint }}>
              {outgoing ? "Outgoing" : "Incoming"}
            </Typography>
          </Stack>
        );
      };

      // Communication tab — reflects the original "Client Communications"
      // profile card (settings + a call log), redesigned to fill the tab.
      // Calls are the logged records (no notes attached); texts/emails are the
      // client-facing channels configured here and opened in their own tools.
      const CommunicationPanel = ({ calls, comms, onOpen, onAction }) => {
        // Newest-first call log.
        const callLog = useMemo(() => [...calls].sort((a, b) => b.ts - a.ts), [calls]);

        const SettingRow = ({ label, value, hint }) => (
          <Stack direction="row" justifyContent="space-between" alignItems="baseline" sx={{ py: 0.5 }}>
            <Stack>
              <Typography sx={{ fontSize: 13, color: colors.labelText }}>{label}</Typography>
              {hint && <Typography sx={{ fontSize: 11, color: colors.mutedText }}>{hint}</Typography>}
            </Stack>
            <Typography sx={{ fontSize: 13, color: colors.primaryText, textAlign: "right" }}>{value}</Typography>
          </Stack>
        );

        return (
          <PanelWrap>
            <Box sx={{ display: "grid", gridTemplateColumns: "minmax(260px, 320px) 1fr", gap: 3, alignItems: "start" }}>
              {/* LEFT: communication settings + channels (from the original card) */}
              <Stack spacing={2}>
                <Box>
                  <SectionLabel sx={{ mb: 1 }}>Client communications</SectionLabel>
                  <Box sx={{ border: `1px solid ${colors.lightBorder}`, borderRadius: "6px", p: 1.5 }}>
                    <SettingRow label="Client-facing number" value={comms.clientFacingNumber} />
                    <Divider sx={{ borderColor: colors.lightBorder, my: 0.5 }} />
                    <SettingRow label="Forwarding email" value={comms.forwardingEmail} />
                    <Divider sx={{ borderColor: colors.lightBorder, my: 0.5 }} />
                    <Stack direction="row" justifyContent="space-between" alignItems="center" sx={{ py: 0.5 }}>
                      <Typography sx={{ fontSize: 13, color: colors.labelText }}>
                        Forward incoming/outgoing email to client
                      </Typography>
                      <YesNo value={comms.forwardToClient} />
                    </Stack>
                  </Box>
                </Box>

                <Box>
                  <SectionLabel sx={{ mb: 1 }}>Channels</SectionLabel>
                  <Stack spacing={1}>
                    <Button
                      variant="outlined"
                      startIcon={<EmailOutlinedIcon />}
                      onClick={() => onAction("Email on client's behalf")}
                      sx={{ justifyContent: "flex-start", fontSize: 12, textTransform: "none", borderColor: colors.border, color: colors.secondaryText }}
                    >
                      Email on client&rsquo;s behalf
                    </Button>
                    <Button
                      variant="outlined"
                      startIcon={<SmsOutlinedIcon />}
                      onClick={() => onAction("Text messages")}
                      sx={{ justifyContent: "flex-start", fontSize: 12, textTransform: "none", borderColor: colors.border, color: colors.secondaryText }}
                    >
                      Text messages
                    </Button>
                    <Button
                      variant="outlined"
                      startIcon={<PhoneIcon />}
                      onClick={() => onAction("Call client — web survey number")}
                      sx={{ justifyContent: "flex-start", fontSize: 12, textTransform: "none", borderColor: colors.border, color: colors.secondaryText }}
                    >
                      Call client &mdash; web survey number
                    </Button>
                  </Stack>
                </Box>
              </Stack>

              {/* RIGHT: call log */}
              <Box>
                <Stack direction="row" justifyContent="space-between" alignItems="center" sx={{ mb: 1 }}>
                  <SectionLabel>Call log</SectionLabel>
                  <Typography sx={mutedTextSx}>{callLog.length} calls</Typography>
                </Stack>
                {/* header row */}
                <Stack
                  direction="row"
                  sx={{ px: 1.5, py: 1, borderBottom: `1px solid ${colors.border}` }}
                >
                  <Typography sx={{ ...tableHeaderLike, flex: 2.2, pr: 1 }}>Date</Typography>
                  <Typography sx={{ ...tableHeaderLike, flex: 1.4, pr: 1 }}>Direction</Typography>
                  <Typography sx={{ ...tableHeaderLike, flex: 1.4, pr: 1 }}>Outcome</Typography>
                  <Typography sx={{ ...tableHeaderLike, flex: 1, textAlign: "right" }}>Duration</Typography>
                </Stack>
                {callLog.map((c) => (
                  <Stack
                    key={c.id}
                    direction="row"
                    alignItems="center"
                    onClick={() => onOpen(c)}
                    sx={{
                      px: 1.5,
                      py: 1.25,
                      borderBottom: `1px solid ${colors.lightBorder}`,
                      cursor: "pointer",
                      "&:hover": { backgroundColor: colors.cardHoverBg },
                    }}
                  >
                    <Typography sx={{ flex: 2.2, fontSize: 13, color: colors.primaryText, pr: 1 }}>{c.when}</Typography>
                    <Box sx={{ flex: 1.4, pr: 1 }}>
                      <CallDirection direction={c.direction} />
                    </Box>
                    <Typography sx={{ flex: 1.4, fontSize: 13, color: colors.secondaryText, pr: 1 }}>{c.outcome}</Typography>
                    <Typography sx={{ flex: 1, fontSize: 13, color: colors.secondaryText, textAlign: "right" }}>{c.duration}</Typography>
                  </Stack>
                ))}
              </Box>
            </Box>
          </PanelWrap>
        );
      };

      const TasksPanel = ({ tasks, onToggle, onOpenTask }) => (
        <PanelWrap>
          <Box sx={{ maxWidth: 720 }}>
            <Stack direction="row" justifyContent="space-between" alignItems="center" sx={{ mb: 2 }}>
              <SectionLabel>Tasks</SectionLabel>
              <Button size="small" startIcon={<AddIcon />} sx={{ fontSize: 11, color: colors.primary }}>New task</Button>
            </Stack>
            <Stack spacing={1}>
              {tasks.map((t) => (
                <Box
                  key={t.id}
                  sx={{
                    display: "flex",
                    alignItems: "flex-start",
                    gap: 1.25,
                    border: `1px solid ${colors.lightBorder}`,
                    borderRadius: "3px",
                    p: 1.5,
                    cursor: "pointer",
                    "&:hover": { backgroundColor: colors.cardHoverBg, borderColor: colors.cardHoverBorder },
                  }}
                  onClick={() => onOpenTask(t)}
                >
                  <IconButton
                    size="small"
                    sx={{ p: 0, mt: "1px" }}
                    onClick={(e) => { e.stopPropagation(); onToggle(t.id); }}
                  >
                    {t.status === "done" ? (
                      <CheckCircleOutlineIcon sx={{ color: colors.green, fontSize: 20 }} />
                    ) : (
                      <RadioButtonUncheckedIcon sx={{ color: colors.mutedText, fontSize: 20 }} />
                    )}
                  </IconButton>
                  <Box sx={{ flex: 1, minWidth: 0 }}>
                    <Typography
                      sx={{
                        fontSize: 14,
                        fontWeight: 500,
                        color: colors.primaryText,
                        textDecoration: t.status === "done" ? "line-through" : "none",
                      }}
                    >
                      {t.title}
                    </Typography>
                    <Stack direction="row" spacing={1.5} alignItems="center" sx={{ mt: 0.75 }}>
                      <StatusChip status={t.status} label={t.statusLabel} />
                      <Stack direction="row" spacing={0.5} alignItems="center">
                        <UserAvatar name={t.assignee} colorSeed={t.assignee} sx={{ width: 18, height: 18, fontSize: 8 }} />
                        <Typography sx={{ fontSize: 12, color: colors.labelText }}>{t.assignee}</Typography>
                      </Stack>
                      <Typography sx={{ fontSize: 12, color: colors.timestampText }}>Due {t.due}</Typography>
                    </Stack>
                  </Box>
                </Box>
              ))}
            </Stack>
          </Box>
        </PanelWrap>
      );

      const DocumentsPanel = () => (
        <PanelWrap>
          <Box sx={{ maxWidth: 720 }}>
            <Box
              sx={{
                border: `1.5px dashed ${colors.border}`,
                borderRadius: "6px",
                p: 3,
                mb: 3,
                textAlign: "center",
                color: colors.labelText,
                backgroundColor: colors.emptyCardBg,
              }}
            >
              <UploadFileIcon sx={{ fontSize: 28, color: colors.mutedText }} />
              <Typography sx={{ fontSize: 13, mt: 0.5 }}>Drag &amp; drop files here, or click to upload</Typography>
            </Box>
            <Stack spacing={1.25}>
              {DOCUMENTS.map((d) => (
                <Stack
                  key={d.id}
                  direction="row"
                  spacing={1.5}
                  alignItems="center"
                  sx={{
                    border: `1px solid ${colors.lightBorder}`,
                    borderRadius: "3px",
                    p: 1.5,
                    cursor: "pointer",
                    "&:hover": { backgroundColor: colors.cardHoverBg, borderColor: colors.cardHoverBorder },
                  }}
                >
                  <DescriptionOutlinedIcon sx={{ color: colors.primary }} />
                  <Box sx={{ flex: 1, minWidth: 0 }}>
                    <Typography sx={{ fontSize: 14, fontWeight: 500, color: colors.primaryText }}>{d.name}</Typography>
                    <Typography sx={{ fontSize: 12, color: colors.labelText }}>{d.size} · {d.by} · {d.when}</Typography>
                  </Box>
                  <EastIcon sx={{ fontSize: 16, color: colors.labelText }} />
                </Stack>
              ))}
            </Stack>
          </Box>
        </PanelWrap>
      );

      // ===================================================================
      // RIGHT PANE CONTENTS
      // ===================================================================
      const PaneHeader = ({ title, onClose }) => (
        <Stack
          direction="row"
          alignItems="center"
          justifyContent="space-between"
          sx={{ px: 2, py: 1.25, borderBottom: `1px solid ${colors.lightBorder}`, flexShrink: 0 }}
        >
          <Typography sx={{ fontSize: 14, fontWeight: 600, color: colors.primaryText }}>{title}</Typography>
          <IconButton size="small" onClick={onClose}><CloseIcon fontSize="small" /></IconButton>
        </Stack>
      );

      // Pinned-note side panel. Any note can be pinned to keep it open on the
      // right while browsing the rest of the profile. Editable in place — the
      // same title + body document surface as the note card.
      const PinnedNotePane = ({ note, onChange, onUnpin, onClose }) => {
        return (
          <>
            {/* header */}
            <Stack
              direction="row"
              alignItems="center"
              justifyContent="space-between"
              sx={{ px: 2, py: 1.25, borderBottom: `1px solid ${colors.lightBorder}`, flexShrink: 0 }}
            >
              <Stack direction="row" alignItems="center" spacing={1}>
                <PushPinIcon sx={{ fontSize: 16, color: colors.primary }} />
                <Typography sx={{ fontSize: 14, fontWeight: 600, color: colors.primaryText }}>Pinned note</Typography>
              </Stack>
              <Stack direction="row" alignItems="center" spacing={0.5}>
                <Tooltip title="Unpin">
                  <IconButton size="small" onClick={onUnpin}><PushPinIcon fontSize="small" sx={{ color: colors.primary }} /></IconButton>
                </Tooltip>
                <Tooltip title="Collapse panel">
                  <IconButton size="small" onClick={onClose}><ChevronRightIcon fontSize="small" /></IconButton>
                </Tooltip>
              </Stack>
            </Stack>

            {/* editable document */}
            <Box sx={{ px: 2, pt: 1.5, pb: 2, display: "flex", flexDirection: "column", flex: 1, minHeight: 0 }}>
              <TextField
                variant="standard"
                placeholder="Untitled note"
                value={note.title}
                onChange={(e) => onChange(note.id, { title: e.target.value })}
                fullWidth
                InputProps={{ disableUnderline: true }}
                sx={{
                  "& .MuiInputBase-input": {
                    fontSize: 18,
                    fontWeight: 700,
                    color: colors.primaryText,
                    padding: "2px 0 4px",
                  },
                }}
              />
              <Typography sx={{ fontSize: 11.5, color: colors.labelText, mb: 1 }}>
                {note.author} · updated {note.updatedWhen}
              </Typography>
              <Box sx={{ flex: 1, minHeight: 0, display: "flex" }}>
                <TextField
                  variant="standard"
                  placeholder="Start writing…"
                  value={note.body}
                  onChange={(e) => onChange(note.id, { body: e.target.value })}
                  fullWidth
                  multiline
                  InputProps={{ disableUnderline: true }}
                  sx={{
                    flex: 1,
                    "& .MuiInputBase-root": { alignItems: "flex-start", height: "100%" },
                    "& .MuiInputBase-input": { fontSize: 14, color: colors.primaryText, lineHeight: 1.6, height: "100% !important", overflow: "auto !important" },
                    "& .MuiInputBase-input::placeholder": { color: colors.mutedText, opacity: 1 },
                  }}
                />
              </Box>
            </Box>
          </>
        );
      };

      const CallDetailPane = ({ call, onClose }) => {
        return (
          <>
            <PaneHeader title="Call detail" onClose={onClose} />
            <Box sx={{ p: 2, display: "flex", flexDirection: "column", gap: 1.5, overflowY: "auto" }}>
              <Stack direction="row" spacing={1.25} alignItems="center">
                <Box sx={{ width: 36, height: 36, borderRadius: "50%", backgroundColor: "#eef7ef", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                  <PhoneInTalkIcon sx={{ fontSize: 20, color: colors.green }} />
                </Box>
                <Box>
                  <Typography sx={{ fontSize: 17, fontWeight: 700, color: colors.primaryText, lineHeight: 1.2 }}>{CLIENT.name}</Typography>
                  <CallDirection direction={call.direction} />
                </Box>
              </Stack>
              <InfoRow label="When" value={call.when} />
              <InfoRow label="Duration" value={call.duration} />
              <InfoRow label="Outcome" value={call.outcome} />
            </Box>
          </>
        );
      };

      const TaskDetailPane = ({ task, onClose, onToggle }) => (
        <>
          <PaneHeader title="Task" onClose={onClose} />
          <Box sx={{ p: 2, display: "flex", flexDirection: "column", gap: 1.75 }}>
            <Typography sx={{ fontSize: 20, fontWeight: 700, color: colors.primaryText }}>{task.title}</Typography>
            <Stack direction="row" spacing={2} alignItems="center">
              <StatusChip status={task.status} label={task.statusLabel} />
              <Button size="small" onClick={() => onToggle(task.id)} sx={{ fontSize: 11 }}>
                {task.status === "done" ? "Reopen" : "Mark done"}
              </Button>
            </Stack>
            <Divider sx={{ borderColor: colors.lightBorder }} />
            <Stack direction="row" spacing={4}>
              <Box>
                <SectionLabel>Assignee</SectionLabel>
                <Stack direction="row" spacing={0.75} alignItems="center" sx={{ mt: 0.5 }}>
                  <UserAvatar name={task.assignee} colorSeed={task.assignee} sx={{ width: 20, height: 20, fontSize: 8 }} />
                  <Typography sx={bodyValueSx}>{task.assignee}</Typography>
                </Stack>
              </Box>
              <Box>
                <SectionLabel>Due</SectionLabel>
                <Typography sx={{ ...bodyValueSx, mt: 0.5 }}>{task.due}</Typography>
              </Box>
            </Stack>
            <Divider sx={{ borderColor: colors.lightBorder }} />
            <SectionLabel>Detail</SectionLabel>
            <Typography sx={{ fontSize: 14, color: colors.primaryText, lineHeight: 1.6 }}>{task.detail}</Typography>
          </Box>
        </>
      );

      // ===================================================================
      // APP SHELL
      // ===================================================================
      const TABS = [
        { key: "overview", label: "Overview", icon: <DashboardOutlinedIcon fontSize="small" /> },
        { key: "activity", label: "Feed", icon: <HistoryIcon fontSize="small" /> },
        { key: "notes", label: "Notes", icon: <NotesIcon fontSize="small" /> },
        { key: "comms", label: "Communication", icon: <ForumOutlinedIcon fontSize="small" /> },
        { key: "tasks", label: "Tasks", icon: <AssignmentOutlinedIcon fontSize="small" /> },
        { key: "documents", label: "Documents", icon: <FolderOpenIcon fontSize="small" /> },
      ];

      function App() {
        const [tab, setTab] = useState("overview");
        const [tasks, setTasks] = useState(TASKS);
        const [notes, setNotes] = useState(NOTES);
        const [calls, setCalls] = useState(CALLS);
        // right pane: { type: 'callDetail' | 'taskDetail', data }
        const [pane, setPane] = useState(null);
        const [toast, setToast] = useState("");
        // Inline expand/edit state for the notes list.
        const [expandedNoteId, setExpandedNoteId] = useState(null);
        const [autoEditNoteId, setAutoEditNoteId] = useState(null);
        // Whether the pinned-note side panel is expanded (vs. collapsed to a tab).
        const [pinnedPaneOpen, setPinnedPaneOpen] = useState(true);

        const pinnedNote = notes.find((n) => n.pinned) || null;

        const findNote = (id) => notes.find((n) => n.id === id);
        const findCall = (id) => calls.find((c) => c.id === id);

        const toggleTask = (id) =>
          setTasks((ts) =>
            ts.map((t) =>
              t.id === id
                ? t.status === "done"
                  ? { ...t, status: "in_progress", statusLabel: "In progress" }
                  : { ...t, status: "done", statusLabel: "Done" }
                : t,
            ),
          );

        // --- Notes CRUD ---------------------------------------------------
        // Autosave silently on each change (Notion-style) — no toast spam.
        const saveNote = (id, patch) => {
          setNotes((ns) =>
            ns.map((n) =>
              n.id === id
                ? { ...n, ...patch, updatedWhen: "just now", updatedTs: Date.now() }
                : n,
            ),
          );
        };
        const newNote = () => {
          const id = "note-" + Date.now();
          const note = {
            id,
            title: "Untitled note",
            author: "Marcus Bell",
            createdWhen: "just now",
            updatedWhen: "just now",
            updatedTs: Date.now(),
            pinned: false,
            body: "",
            versions: [],
          };
          setNotes((ns) => [note, ...ns]);
          setTab("notes");
          setExpandedNoteId(id);
          setAutoEditNoteId(id);
        };
        const toggleExpand = (id) => {
          setExpandedNoteId((cur) => (cur === id ? null : id));
          setAutoEditNoteId(null);
        };
        // Open a note inline in the center list (from the feed).
        const openNoteInline = (note) => {
          setTab("notes");
          setExpandedNoteId(note.id);
          setAutoEditNoteId(null);
        };

        // --- Pinning ------------------------------------------------------
        // Only one note is pinned at a time (keeps the side panel simple).
        // Pinning opens the panel; unpinning clears it.
        const togglePin = (id) => {
          setNotes((ns) =>
            ns.map((n) =>
              n.id === id ? { ...n, pinned: !n.pinned } : { ...n, pinned: false },
            ),
          );
          const willPin = !(notes.find((n) => n.id === id)?.pinned);
          if (willPin) setPinnedPaneOpen(true);
        };
        const unpin = () => setNotes((ns) => ns.map((n) => ({ ...n, pinned: false })));

        const closePane = () => setPane(null);

        // Jump from a feed item to its source. Notes open inline in the center
        // list; calls/tasks open in the right pane.
        const navigateToSource = (source) => {
          if (!source) return;
          if (source.kind === "note") {
            const note = findNote(source.id);
            if (note) openNoteInline(note);
          } else if (source.kind === "call") {
            setTab("comms");
            setPane({ type: "callDetail", data: findCall(source.id) });
          } else if (source.kind === "task") {
            setTab("tasks");
            const task = tasks.find((t) => t.id === source.id);
            if (task) setPane({ type: "taskDetail", data: task });
          } else if (source.kind === "document") {
            setTab("documents");
            setToast("Opened " + (findDoc(source.id)?.name || "document"));
          }
        };

        // Open a call record in the detail pane.
        const openComm = (item) => setPane({ type: "callDetail", data: item });

        // Right-side resolution:
        //  - a transient detail pane (call/task) takes precedence
        //  - otherwise the pinned-note pane shows if a note is pinned & open
        const showDetailPane = !!pane;
        const showPinned = !pane && !!pinnedNote && pinnedPaneOpen;
        const rightWidth = showPinned || showDetailPane ? 440 : 0;

        return (
          <Box sx={{ height: "100%", display: "flex", flexDirection: "column" }}>
            {/* Top bar */}
            <Box
              sx={{
                height: 44,
                flexShrink: 0,
                display: "flex",
                alignItems: "center",
                px: 2,
                borderBottom: `1px solid ${colors.lightBorder}`,
                gap: 1.5,
              }}
            >
              <Typography sx={{ fontSize: 15, fontWeight: 700, color: colors.primary, letterSpacing: 0.5 }}>ez</Typography>
              <Divider orientation="vertical" flexItem sx={{ borderColor: colors.lightBorder }} />
              <Typography sx={{ fontSize: 13, color: colors.labelText }}>Client Profile</Typography>
              <Box sx={{ flex: 1 }} />
              <Chip size="small" label="MVP" sx={{ fontSize: 10, height: 20, backgroundColor: "#F3FAFF", color: colors.primary }} />
            </Box>

            {/* Body: left sidebar | center tabs | right pane */}
            <Box sx={{ flex: 1, display: "flex", minHeight: 0, position: "relative" }}>
              <LeftSidebar
                onStartCall={() => setToast("Calling is handled by the dialer app in this prototype")}
                onStartText={() => setToast("Texting is stubbed in this prototype")}
              />

              {/* Center */}
              <Box sx={{ flex: 1, minWidth: 0, display: "flex", flexDirection: "column" }}>
                <Tabs
                  value={tab}
                  onChange={(_, v) => setTab(v)}
                  variant="scrollable"
                  scrollButtons={false}
                  sx={{
                    borderBottom: `1px solid ${colors.lightBorder}`,
                    px: 1,
                    minHeight: 44,
                    "& .MuiTab-root": { minHeight: 44, minWidth: "auto", px: 2, fontSize: 13 },
                  }}
                >
                  {TABS.map((t) => (
                    <Tab
                      key={t.key}
                      value={t.key}
                      iconPosition="start"
                      icon={t.icon}
                      label={
                        t.key === "tasks"
                          ? <Badge color="primary" badgeContent={tasks.filter((x) => x.status !== "done").length} sx={{ "& .MuiBadge-badge": { position: "static", transform: "none", ml: 0.75, fontSize: 10, height: 16, minWidth: 16 } }}>Tasks</Badge>
                          : t.label
                      }
                    />
                  ))}
                </Tabs>

                <Box sx={{ flex: 1, minHeight: 0 }}>
                  {tab === "overview" && (
                    <OverviewPanel
                      onAction={(label) => setToast(label + " — stubbed in this prototype")}
                    />
                  )}
                  {tab === "activity" && <FeedPanel onNavigate={navigateToSource} />}
                  {tab === "notes" && (
                    <NotesPanel
                      notes={notes}
                      expandedId={expandedNoteId}
                      autoEditId={autoEditNoteId}
                      onToggleExpand={toggleExpand}
                      onSaveNote={saveNote}
                      onNewNote={newNote}
                      onTogglePin={togglePin}
                    />
                  )}
                  {tab === "comms" && (
                    <CommunicationPanel
                      calls={calls}
                      comms={CLIENT.comms}
                      onOpen={openComm}
                      onAction={(label) => setToast(label + " — opens in the dialer/messaging app")}
                    />
                  )}
                  {tab === "tasks" && <TasksPanel tasks={tasks} onToggle={toggleTask} onOpenTask={(t) => setPane({ type: "taskDetail", data: t })} />}
                  {tab === "documents" && <DocumentsPanel />}
                </Box>
              </Box>

              {/* Reopen tab for the collapsed pinned-note pane */}
              {!showPinned && !showDetailPane && pinnedNote && !pinnedPaneOpen && (
                <Tooltip title="Open pinned note" placement="left">
                  <Box
                    onClick={() => setPinnedPaneOpen(true)}
                    sx={{
                      position: "absolute",
                      right: 0,
                      top: 120,
                      display: "flex",
                      alignItems: "center",
                      gap: 0.5,
                      px: 1,
                      py: 1.25,
                      borderTopLeftRadius: 6,
                      borderBottomLeftRadius: 6,
                      backgroundColor: colors.primary,
                      color: "#fff",
                      cursor: "pointer",
                      boxShadow: "0px 2px 8px #0000002A",
                      writingMode: "vertical-rl",
                      "&:hover": { backgroundColor: "#0d4a94" },
                    }}
                  >
                    <PushPinIcon sx={{ fontSize: 16, transform: "rotate(90deg)" }} />
                    <Typography sx={{ fontSize: 12, fontWeight: 600 }}>Pinned note</Typography>
                  </Box>
                </Tooltip>
              )}

              {/* Right pane */}
              <RightPane open={showPinned || showDetailPane} width={rightWidth}>
                {showPinned && (
                  <PinnedNotePane
                    note={pinnedNote}
                    onChange={saveNote}
                    onUnpin={unpin}
                    onClose={() => setPinnedPaneOpen(false)}
                  />
                )}
                {showDetailPane && pane?.type === "callDetail" && (
                  <CallDetailPane call={pane.data} onClose={closePane} />
                )}
                {showDetailPane && pane?.type === "taskDetail" && (
                  <TaskDetailPane
                    task={tasks.find((t) => t.id === pane.data.id) || pane.data}
                    onClose={closePane}
                    onToggle={toggleTask}
                  />
                )}
              </RightPane>
            </Box>

            <Snackbar
              open={!!toast}
              autoHideDuration={2600}
              onClose={() => setToast("")}
              anchorOrigin={{ vertical: "bottom", horizontal: "center" }}
            >
              <Alert severity="success" variant="filled" onClose={() => setToast("")} sx={{ fontSize: 13 }}>
                {toast}
              </Alert>
            </Snackbar>
          </Box>
        );
      }

      const bootEl = document.getElementById("boot");
      if (bootEl) bootEl.remove();
      createRoot(document.getElementById("root")).render(
        <ThemeProvider theme={theme}>
          <CssBaseline />
          <App />
        </ThemeProvider>,
      );
    </script>
  </body>
</html>
